<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="google" content="notranslate" />
    <title>Aplicação Hurtz | Clínicas de Cirurgia Estética Facial</title>
    <meta
      name="description"
      content="Aplicação para clínicas de cirurgia estética facial com agendamento integrado à Hurtz."
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="form-shell" aria-live="polite">
      <input class="honeypot" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" />
      <button class="back-button" type="button" hidden aria-label="Voltar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18 9 12l6-6" />
        </svg>
      </button>

      <section class="form-card" id="app"></section>
    </main>

    <aside class="event-drawer" aria-label="Eventos capturados">
      <button class="event-toggle" type="button" aria-expanded="false">Eventos</button>
      <div class="event-panel" hidden>
        <strong>Fila local</strong>
        <p>
          Espelha os disparos do Chronos sem enviar dados ao sistema do seu amigo. Na integração,
          trocamos o adapter por endpoints da Hurtz/CRM.
        </p>
        <pre id="event-log">[]</pre>
      </div>
    </aside>

    <noscript>
      <p class="noscript">Este formulário precisa de JavaScript para funcionar.</p>
    </noscript>
  </body>
</html>
