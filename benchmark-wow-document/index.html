<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Preencha o formulário para receber acesso à skill Benchmark de Mercado da Hurtz.">
  <title>Acesso à skill Benchmark de Mercado | Hurtz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--off:#F5F2EC;--dark:#181614;--graph:#3D3A36;--stone:#8C8880;--sand:#E8E4DC;--orange:#C06018;--orange-dark:#974A12}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--off);color:var(--dark);font:400 16px/1.6 Inter,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column}main{flex:1;display:grid;place-items:center;padding:22px 18px}.capture{width:min(100%,460px)}.logo{display:block;width:148px;height:auto;margin:0 auto 16px}.accent{width:40px;height:3px;background:var(--orange);margin-bottom:16px}.capture h1{font-size:clamp(30px,4.2vw,42px);line-height:1.06;letter-spacing:-.04em;margin:0 0 12px}.capture>p{color:var(--graph);margin:0 0 18px;font-size:15px;line-height:1.4}.form{background:var(--dark);padding:20px;color:var(--off);border-radius:4px}.field{margin:0 0 10px}.field label{display:block;color:#d8d1c7;font-size:11px;margin-bottom:4px}.field input{width:100%;border:1px solid #665f56;background:#25211e;color:var(--off);padding:10px 12px;border-radius:2px;font:inherit;font-size:15px}.field input:focus{outline:1px solid var(--off)}.button{display:flex;width:100%;justify-content:center;border:0;border-radius:2px;background:var(--orange);color:#fff;padding:12px 18px;font:700 13px Inter;cursor:pointer}.button:hover{background:var(--orange-dark)}.status{min-height:18px;color:#e9b58d;font-size:12px;margin-top:8px}.hp{position:absolute;left:-10000px}footer{padding:16px 18px;text-align:center;color:var(--stone);font-size:11px;border-top:1px solid var(--sand)}@media(max-width:600px){main{padding:28px 16px}.capture{max-width:440px}.logo{width:132px;margin-bottom:20px}.capture h1{font-size:clamp(30px,9vw,38px)}.form{padding:18px}.field input{font-size:16px}}
  </style>
</head>
<body>
  <main>
    <section class="capture" aria-labelledby="title">
      <img class="logo" src="assets/logo-hurtz.png" alt="Hurtz">
      <div class="accent"></div>
      <h1 id="title">Preencha o formulário abaixo para receber acesso à skill.</h1>
      <p>Informe seus dados para liberar o download da skill Benchmark de Mercado e dos tutoriais de uso.</p>
      <div class="form">
        <form id="leadForm" novalidate>
          <div class="field"><label for="nome">Nome</label><input id="nome" name="nome" autocomplete="name" required></div>
          <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="telefone">Telefone / WhatsApp</label><input id="telefone" name="telefone" type="tel" inputmode="tel" autocomplete="tel" required></div>
          <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
          <button class="button" type="submit">Receber acesso →</button>
          <div class="status" id="formStatus" role="status" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>
  <footer>Hurtz Company</footer>
  <script>
    (() => {
      const endpoint = "https://uxttihjsxfowursjyult.supabase.co/functions/v1/benchmark-download-submit";
      const form = document.getElementById("leadForm");
      const status = document.getElementById("formStatus");
      const digits = (value) => value.replace(/\D/g, "");
      const params = new URLSearchParams(location.search);
      document.getElementById("telefone").addEventListener("input", (event) => {
        const value = digits(event.target.value).slice(0, 11);
        event.target.value = value.length > 10 ? `(${value.slice(0,2)}) ${value.slice(2,7)}-${value.slice(7)}` : value;
      });
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!form.checkValidity()) { form.reportValidity(); return; }
        const payload = Object.fromEntries(new FormData(form).entries());
        payload.asset_slug = "benchmark-mercado-skill";
        payload.landing_url = location.href;
        payload.referrer_url = document.referrer;
        ["utm_source","utm_medium","utm_campaign","utm_content","utm_term"].forEach((key) => { payload[key] = params.get(key) || ""; });
        status.textContent = "Liberando seu acesso…";
        try {
          const response = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || "Não foi possível concluir.");
          location.href = "download/";
        } catch (error) { status.textContent = error.message || "Não foi possível concluir agora. Tente novamente."; }
      });
    })();
  </script>
</body>
</html>
