<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Obrigado | Hurtz</title>
    <meta
      name="description"
      content="Em até 12 horas um consultor da Hurtz falará com você."
    />
    <meta name="theme-color" content="#181614" />
    <link rel="icon" type="image/png" href="../assets/logo-atual-icone-escuro.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar" aria-label="Hurtz">
        <img src="../assets/logo-atual-escuro.png" alt="Hurtz Company" width="1774" height="400" />
      </header>

      <section class="hero" aria-labelledby="thanks-title">
        <span class="accent-line" aria-hidden="true"></span>
        <h1 id="thanks-title">Em até 12 horas um consultor falará com você!</h1>
      </section>

      <section class="video-section" aria-labelledby="steps-title">
        <div class="section-heading">
          <span class="eyebrow">Próximos Passos</span>
          <h2 id="steps-title">Assista agora</h2>
        </div>

        <div class="video-frame" aria-label="Espaço reservado para o vídeo">
          <div class="play-mark" aria-hidden="true"></div>
          <p>Vídeo entra aqui.</p>
        </div>
      </section>
    </main>
  </body>
</html>
