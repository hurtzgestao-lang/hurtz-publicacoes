<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#512538">
  <title>Agenda Blindada | Dra. Emanuele</title>
  <meta name="description" content="Para donos de clínicas que faturam acima de R$ 20 mil: converta mais pacientes pelo WhatsApp sem depender de mais anúncios.">
  <style>
    :root {
      --plum: #512538;
      --plum-deep: #26151f;
      --peach: #f0bea9;
      --cream: #fff8f0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--cream);
      background: var(--plum-deep);
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
    }
    a { color: inherit; }

    .intro {
      position: relative;
      z-index: 1;
      padding: 17px 20px;
      background: var(--plum);
      border-bottom: 1px solid rgba(255, 255, 255, .16);
      text-align: center;
    }

    h1 {
      max-width: 1280px;
      margin: 0 auto;
      font-size: clamp(16px, 1.5vw, 24px);
      font-weight: 400;
      line-height: 1.22;
      letter-spacing: -.01em;
      text-wrap: balance;
      text-transform: uppercase;
    }

    h1 strong { font-weight: 800; }

    .hero {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      flex: 1;
      padding: clamp(22px, 3.5svh, 44px) 22px;
      overflow: hidden;
      background: var(--plum-deep);
    }

    .hero::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      background: url("assets/clinica-generica.jpg") center center / cover no-repeat;
    }

    .hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 78%, rgba(107, 48, 68, .77), transparent 57%),
        linear-gradient(180deg, rgba(20, 10, 17, .77), rgba(20, 10, 17, .83));
    }

    .content {
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      justify-items: center;
      gap: clamp(16px, 2.5svh, 24px);
      width: min(100%, 1120px);
      margin: 0 auto;
      text-align: center;
    }

    .video-shell {
      position: relative;
      width: min(100%, 320px, 39svh);
      min-width: 230px;
      margin: 0 auto;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 18px;
      background: #151118;
      box-shadow: 0 28px 72px rgba(10, 7, 11, .5);
    }

    .video-shell iframe {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .next-step {
      display: none;
      width: min(100%, 420px);
      margin: 0 auto;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      visibility: hidden;
      transition: opacity .35s ease, transform .35s ease, visibility .35s ease;
    }

    .next-step.is-visible {
      display: block;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
      visibility: visible;
    }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: min(100%, 420px);
      min-height: 56px;
      margin: 0 auto;
      padding: 12px 20px;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 12px;
      background: var(--peach);
      box-shadow: 0 13px 32px rgba(0, 0, 0, .25);
      color: var(--plum-deep);
      font-size: clamp(15px, 1.5vw, 19px);
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      text-decoration: none;
      transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    .cta:hover {
      background: #ffd3bf;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .32);
      transform: translateY(-2px);
    }

    .cta:focus-visible {
      outline: 3px solid var(--cream);
      outline-offset: 4px;
    }

    .cta svg { width: 19px; height: 19px; flex: none; }

    @media (min-width: 860px) {
      .video-shell {
        width: clamp(300px, 40svh, 340px);
      }
    }

    @media (max-width: 480px) {
      .intro { padding: 14px 16px; }
      .hero { padding: 13px 16px; }
      .video-shell { border-radius: 10px; }
    }

    @media (max-height: 700px) {
      .video-shell { width: min(100%, 320px, 41svh); }
      .intro { padding-top: 11px; padding-bottom: 11px; }
      .hero { padding-top: 9px; padding-bottom: 9px; }
      .cta { min-height: 50px; }
    }

    @media (min-width: 860px) and (max-height: 700px) {
      .video-shell { width: clamp(280px, 41svh, 320px); }
    }

    @media (max-height: 620px) {
      .video-shell { width: min(100%, 280px, 38svh); }
      .cta { min-height: 46px; }
    }

    @media (min-width: 860px) and (max-height: 620px) {
      .video-shell { width: clamp(250px, 38svh, 290px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .next-step,
      .cta { transition: none; }
    }
  </style>
</head>
<body>
  <header class="intro">
    <h1><strong>Para donos de clínicas que faturam acima de R$ 20 mil:</strong> converta mais pacientes pelo WhatsApp <strong>sem depender de mais anúncios.</strong></h1>
  </header>

  <main class="hero">
    <div class="content">
      <div class="video-shell">
        <iframe src="https://www.youtube-nocookie.com/embed/ijU9gvvB_mg?rel=0&playsinline=1&enablejsapi=1" title="VSL da Dra. Emanuele: Agenda Blindada para clínicas" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>

      <section class="next-step" aria-label="Próximo passo" aria-hidden="true">
        <a class="cta" href="https://pay.kiwify.com.br/A1cSJrH" aria-label="Abrir checkout do Agenda Blindada">
          Quero acessar agora
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </section>
    </div>
  </main>
  <script>
    // O preço da VSL começa por volta de 3min40s no roteiro enviado.
    const PURCHASE_BUTTON_REVEAL_SECONDS = 220;
    const purchaseStep = document.querySelector(".next-step");
    const videoFrame = document.querySelector(".video-shell iframe");
    let purchaseButtonVisible = false;
    let playerCheckTimer = null;

    function revealPurchaseButton() {
      if (purchaseButtonVisible || !purchaseStep) return;
      purchaseButtonVisible = true;
      purchaseStep.classList.add("is-visible");
      purchaseStep.removeAttribute("aria-hidden");
      if (playerCheckTimer) window.clearInterval(playerCheckTimer);
    }

    function startPlayerTimeCheck(player) {
      const checkTime = () => {
        try {
          const currentTime = player.getCurrentTime();
          if (currentTime >= PURCHASE_BUTTON_REVEAL_SECONDS) {
            revealPurchaseButton();
          }
        } catch (error) {
          window.clearInterval(playerCheckTimer);
        }
      };

      playerCheckTimer = window.setInterval(checkTime, 500);
      checkTime();
    }

    window.onYouTubeIframeAPIReady = function onYouTubeIframeAPIReady() {
      if (!videoFrame || !window.YT?.Player) return;

      new YT.Player(videoFrame, {
        events: {
          onReady(event) {
            startPlayerTimeCheck(event.target);
          },
          onStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
              revealPurchaseButton();
            }
          }
        }
      });
    };

    if (videoFrame) {
      const apiScript = document.createElement("script");
      apiScript.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(apiScript);
    }
  </script>
</body>
</html>
