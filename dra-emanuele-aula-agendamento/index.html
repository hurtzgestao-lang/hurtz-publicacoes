<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#512538">
  <title>Diagnóstico exclusivo | Dra. Emanuele</title>
  <meta name="description" content="Diagnóstico exclusivo para donos de clínicas que faturam acima de R$ 30 mil e desejam escalar até R$ 100 mil mensais.">
  <style>
    :root {
      --plum: #512538;
      --plum-deep: #26151f;
      --peach: #f0bea9;
      --cream: #fff8f0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--cream);
      background: var(--plum-deep);
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; }
    a { color: inherit; }

    .intro {
      position: relative;
      z-index: 1;
      padding: 23px 20px;
      background: var(--plum);
      border-bottom: 1px solid rgba(255, 255, 255, .16);
      text-align: center;
    }

    h1 {
      max-width: 1280px;
      margin: 0 auto;
      font-size: clamp(16px, 1.5vw, 24px);
      font-weight: 400;
      line-height: 1.22;
      letter-spacing: -.01em;
      text-wrap: balance;
      text-transform: uppercase;
    }

    h1 strong { font-weight: 800; }

    .hero {
      position: relative;
      isolation: isolate;
      min-height: calc(100svh - 90px);
      padding: 27px 20px 60px;
      overflow: hidden;
      background: var(--plum-deep);
    }

    .hero::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      background: url("assets/clinica-generica.jpg") center center / cover no-repeat;
    }

    .hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 78%, rgba(107, 48, 68, .77), transparent 57%),
        linear-gradient(180deg, rgba(20, 10, 17, .77), rgba(20, 10, 17, .83));
    }

    .content {
      width: min(100%, 1010px);
      margin: 0 auto;
      text-align: center;
    }

    .video-shell {
      position: relative;
      width: min(100%, 300px);
      margin: 0 auto;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 18px;
      background: #151118;
      box-shadow: 0 28px 72px rgba(10, 7, 11, .5);
    }

    .video-shell iframe {
      display: block;
      position: absolute;
      top: 0;
      left: 50%;
      width: 316%;
      height: 100%;
      border: 0;
      transform: translateX(-50%);
    }

    .video-shell::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 52px;
      background: linear-gradient(#151118 75%, rgba(21, 17, 24, 0));
      pointer-events: none;
    }

    .next-step {
      max-width: 900px;
      margin: 26px auto 0;
    }

    h2 {
      margin: 0;
      font-size: clamp(24px, 3vw, 38px);
      font-weight: 450;
      line-height: 1.2;
      letter-spacing: -.035em;
      text-wrap: balance;
    }

    h2 strong { font-weight: 800; }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: min(100%, 530px);
      min-height: 66px;
      margin: 25px auto 0;
      padding: 16px 24px;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 12px;
      background: var(--peach);
      box-shadow: 0 13px 32px rgba(0, 0, 0, .25);
      color: var(--plum-deep);
      font-size: clamp(16px, 2vw, 21px);
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      text-decoration: none;
      transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    .cta:hover {
      background: #ffd3bf;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .32);
      transform: translateY(-2px);
    }

    .cta:focus-visible {
      outline: 3px solid var(--cream);
      outline-offset: 4px;
    }

    .cta svg { width: 19px; height: 19px; flex: none; }

    @media (max-width: 768px) {
      .video-shell { width: min(100%, 240px); }
    }

    @media (max-width: 480px) {
      .intro { padding: 19px 16px 21px; }
      .hero { min-height: auto; padding: 22px 16px 45px; }
      .video-shell { width: min(100%, 260px); border-radius: 10px; }
      .next-step { margin-top: 25px; }
      .cta { min-height: 60px; margin-top: 23px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cta { transition: none; }
    }
  </style>
</head>
<body>
  <header class="intro">
    <h1><strong>Diagnóstico exclusivo</strong> para donos de clínicas que faturam acima de R$ 30 mil e desejam <strong>criar e escalar até R$ 100 mil mensais.</strong></h1>
  </header>

  <main class="hero">
    <div class="content">
      <div class="video-shell">
        <iframe src="https://www.youtube-nocookie.com/embed/pNxR3YHgO1I?rel=0" title="Aula da Dra. Emanuele: método de aceleração para profissionais da saúde e estética" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>

      <section class="next-step" aria-labelledby="next-step-title">
        <h2 id="next-step-title">Agende uma reunião com um especialista em escala para clínicas e identifique as estratégias para levar seu faturamento para <strong>mais de R$ 100 mil mensais.</strong></h2>
        <a class="cta" href="https://wa.me/5521968779225?text=Ol%C3%A1%2C%20vim%20da%20aula%20da%20Dra.%20Emanuele%20e%20quero%20agendar%20uma%20reuni%C3%A3o%20para%20identificar%20estrat%C3%A9gias%20para%20levar%20o%20faturamento%20da%20minha%20cl%C3%ADnica%20a%20mais%20de%20R%24%20100%20mil%20mensais." target="_blank" rel="noopener noreferrer" aria-label="Agendar reunião pelo WhatsApp, abre em nova aba">
          Agendar reunião
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </section>
    </div>
  </main>
</body>
</html>
