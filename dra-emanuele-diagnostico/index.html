<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Diagnóstico Estratégico | Dra. Emanuele</title>
  <style>
    :root {
      --page: #f8f4ee;
      --surface: #fffdf9;
      --surface-soft: #f1ebe2;
      --header: #ffffff;
      --line: #e6ddd1;
      --text: #211b1c;
      --text-soft: #706669;
      --muted: #a59a9b;
      --bot-bubble: #efe9e1;
      --bot-text: #1d1d1f;
      --accent: #c8a77c;
      --accent-ink: #241b19;
      --action: #6b3044;
      --action-dark: #542335;
      --danger: #a23b43;
      --danger-bg: rgba(162, 59, 67, .08);
      --shadow: 0 22px 70px rgba(20, 20, 25, .18);
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --display: Geist, Inter, ui-sans-serif, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--page);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 clamp(16px, 4vw, 40px);
      background: var(--header);
      border-bottom: 1px solid var(--line);
    }

    .progress {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .progress-track {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 4px;
      max-height: 4px;
    }

    .progress-seg {
      flex: 1;
      display: block;
      height: 4px;
      min-height: 4px;
      max-height: 4px;
      align-self: center;
      border-radius: 999px;
      background: var(--line);
    }

    .progress-seg.is-done,
    .progress-seg.is-active {
      background: var(--accent);
    }

    .progress-seg.is-active {
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: .48;
      }
      50% {
        opacity: 1;
      }
    }

    .progress-count {
      display: flex;
      align-items: baseline;
      gap: 4px;
      flex: 0 0 auto;
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 600;
    }

    .progress-count strong {
      color: var(--text);
      font-family: var(--display);
      font-size: 20px;
      line-height: 1;
    }

    .scroll {
      flex: 1;
      overflow-y: auto;
      padding: 32px 20px 28px;
      scroll-padding-bottom: 28dvh;
    }

    .thread {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .row {
      display: flex;
      align-items: flex-end;
      gap: 11px;
    }

    .row-user {
      justify-content: flex-end;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(9px) scale(.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .avatar {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      overflow: hidden;
      color: #f8f7f4;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: .02em;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 28%;
      display: block;
    }

    .bubble {
      max-width: 600px;
      padding: 13px 17px;
      border-radius: 16px;
      font-size: 16px;
      line-height: 1.55;
      word-break: break-word;
    }

    .bubble-bot {
      background: var(--bot-bubble);
      color: var(--bot-text);
      border-bottom-left-radius: 5px;
    }

    .bubble-user {
      background: var(--accent);
      color: var(--accent-ink);
      border-bottom-right-radius: 5px;
      font-weight: 650;
    }

    .typing {
      display: flex;
      align-items: flex-end;
      gap: 11px;
    }

    .typing-bubble {
      display: inline-flex;
      gap: 5px;
      padding: 15px 18px;
      border-radius: 16px 16px 16px 5px;
      background: var(--bot-bubble);
    }

    .typing-bubble span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #c2beb8;
      animation: blink 1.3s infinite ease-in-out;
    }

    .typing-bubble span:nth-child(2) {
      animation-delay: .18s;
    }

    .typing-bubble span:nth-child(3) {
      animation-delay: .36s;
    }

    @keyframes blink {
      0%,
      80%,
      100% {
        opacity: .3;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    .wait-note {
      margin-top: 6px;
      padding-left: 4px;
      color: var(--text-soft);
      font-size: 12.5px;
      font-weight: 600;
    }

    .inputbar {
      width: 100%;
      max-width: 100%;
      margin: 6px 0 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-margin-bottom: 20dvh;
    }

    .consent {
      max-width: 100%;
      margin: 0 0 10px;
      color: var(--text-soft);
      font-size: 12.5px;
      line-height: 1.45;
    }

    .consent a {
      color: #795436;
      font-weight: 700;
    }

    .field-label {
      display: block;
      text-align: center;
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 62px;
      padding: 7px 8px 7px 18px;
      border: 1px solid var(--accent);
      border-radius: 14px;
      background: var(--surface);
      cursor: text;
    }

    .field-phone {
      border-color: #cdb99e;
      border-radius: 22px;
      background: #fffefb;
    }

    .field:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200, 167, 124, .14);
    }

    .text-input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      -webkit-text-fill-color: var(--text);
      opacity: 1;
      padding: 10px 0;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 400;
      caret-color: var(--text);
    }

    .text-input::placeholder {
      color: var(--muted);
    }

    .send {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--action);
      color: #fff;
      cursor: pointer;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      transition: .15s ease;
    }

    .field-phone .send {
      background: #f5bea9;
      font-weight: 300;
    }

    .send:hover {
      background: var(--action-dark);
    }

    .field-phone .send:hover {
      background: #efa98f;
    }

    .send:disabled {
      opacity: .34;
      cursor: default;
    }

    .country {
      position: relative;
    }

    .country-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 82px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      background: var(--surface-soft);
      color: var(--text);
      padding: 0 11px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 800;
    }

    .field-phone .country-btn {
      border-radius: 13px;
      background: #f3f1ef;
    }

    .country-code {
      color: #795436;
      font-size: 13px;
      font-weight: 800;
    }

    .field-phone .country-code {
      color: #9c642d;
    }

    .country-chev {
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 800;
      line-height: 1;
    }

    .field-phone .country-chev {
      color: #77716f;
      font-size: 13px;
    }

    .country-menu {
      position: absolute;
      left: 0;
      bottom: 52px;
      z-index: 10;
      width: 130px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .country-menu button {
      width: 100%;
      display: flex;
      gap: 6px;
      border: 0;
      background: transparent;
      padding: 11px 15px;
      cursor: pointer;
      color: var(--text);
      text-align: left;
    }

    .country-menu button:hover {
      background: var(--surface-soft);
    }

    .trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      padding: 17px 20px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      touch-action: manipulation;
    }

    .trigger span:first-child {
      color: var(--text-soft);
      font-weight: 600;
    }

    .skip {
      align-self: center;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text-soft);
      padding: 11px 18px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
    }

    .error {
      border: 1px solid rgba(232, 86, 0, .28);
      border-radius: 9px;
      background: var(--danger-bg);
      color: var(--danger);
      padding: 8px 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 650;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      background: rgba(20, 20, 25, .35);
      backdrop-filter: blur(4px);
      padding: 18px;
    }

    .modal {
      width: min(100%, 520px);
      max-height: 84dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      padding: 22px 22px 14px;
    }

    .modal-title {
      margin: 0;
      color: var(--text);
      font-family: var(--display);
      font-size: 20px;
      line-height: 1.2;
    }

    .modal-sub {
      margin: 4px 0 0;
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.4;
    }

    .modal-close {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: var(--surface-soft);
      color: var(--text-soft);
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
    }

    .search {
      margin: 0 22px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      padding: 12px 14px;
      outline: 0;
      font-size: 15px;
    }

    .option-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px 16px 18px;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      padding: 16px 18px;
      cursor: pointer;
      text-align: left;
      font-size: 15.5px;
      font-weight: 700;
    }

    .option:hover {
      border-color: var(--accent);
      background: rgba(201, 183, 156, .16);
    }

    .empty {
      padding: 24px;
      color: var(--text-soft);
      text-align: center;
    }

    .final {
      min-height: calc(100dvh - 60px);
      padding: clamp(28px, 5vw, 54px) 20px;
      background: linear-gradient(180deg, #fbfaf7 0%, #f2eee7 100%);
    }

    .final-inner {
      width: min(100%, 940px);
      margin: 0 auto;
    }

    .kicker {
      margin: 0 0 12px;
      color: #795436;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .final h1 {
      margin: 0;
      max-width: 760px;
      color: var(--text);
      font-family: var(--display);
      font-size: clamp(32px, 7vw, 58px);
      line-height: .98;
      letter-spacing: 0;
    }

    .final-lede {
      max-width: 650px;
      margin: 18px 0 30px;
      color: var(--text-soft);
      font-size: 18px;
      line-height: 1.55;
    }

    .video {
      aspect-ratio: 16 / 9;
      min-height: 280px;
      overflow: hidden;
      border: 1px solid #2b2823;
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .05), transparent 35%),
        radial-gradient(circle at 35% 30%, rgba(201, 183, 156, .3), transparent 32%),
        #121212;
      color: #fff;
      text-align: center;
      box-shadow: 0 24px 60px rgba(30, 26, 20, .18);
    }

    .video iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }

    .play {
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--action);
      color: #fff;
      font-size: 34px;
      padding-left: 5px;
    }

    .video p {
      margin: 0;
      color: #d9d4ca;
      font-weight: 700;
    }

    .schedule {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 380px);
      gap: 22px;
      align-items: start;
      margin-top: 24px;
    }

    .schedule-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      padding: 22px;
    }

    .schedule-card h2 {
      margin: 0 0 8px;
      font-size: 24px;
      font-family: var(--display);
    }

    .schedule-card p {
      margin: 0 0 18px;
      color: var(--text-soft);
      line-height: 1.5;
    }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .slot {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      padding: 14px;
      text-align: center;
      color: var(--text);
      cursor: pointer;
      font-weight: 750;
    }

    .slot:hover,
    .slot.selected {
      border-color: var(--accent);
      background: rgba(201, 183, 156, .18);
      color: #98652d;
    }

    .wa-cta {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      background: var(--action);
      color: #fff;
      cursor: pointer;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      display: block;
      text-align: center;
      text-decoration: none;
    }

    .wa-cta:hover {
      background: var(--action-dark);
    }

    .done {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-soft);
      padding: 16px;
      font-size: 15px;
      font-weight: 650;
    }

    .check {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 900;
    }

    @media (max-width: 720px) {
      .topbar {
        height: 56px;
      }

      .scroll {
        padding: 18px 12px 18px;
      }

      .thread {
        gap: 10px;
      }

      .row {
        gap: 8px;
      }

      .bubble {
        max-width: calc(100vw - 74px);
        padding: 11px 14px;
        font-size: 15px;
        line-height: 1.45;
      }

      .avatar {
        width: 34px;
        height: 34px;
      }

      .inputbar {
        gap: 8px;
      }

      .field {
        min-height: 56px;
        padding: 6px 7px 6px 14px;
      }

      .text-input {
        font-size: 16px;
      }

      .send {
        width: 42px;
        height: 42px;
      }

      .country-btn {
        padding-inline: 8px;
      }

      .trigger {
        padding: 15px 16px;
        font-size: 15px;
      }

      .modal-backdrop {
        align-items: end;
        padding: 10px;
      }

      .modal {
        width: 100%;
        max-height: 76dvh;
        border-radius: 18px 18px 14px 14px;
      }

      .modal-head {
        padding: 18px 18px 12px;
      }

      .option-list {
        padding: 2px 12px 14px;
      }

      .option {
        padding: 14px 15px;
        font-size: 14.5px;
      }

      .schedule {
        grid-template-columns: 1fr;
      }

      .slot-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="progress">
        <div class="progress-track" id="progressTrack" aria-label="Progresso"></div>
        <div class="progress-count"><strong id="currentCount">0</strong><span>de</span><span id="totalCount">6</span></div>
      </div>
    </header>

    <section class="scroll" id="chatView">
      <div class="thread" id="thread"></div>
    </section>
  </main>

  <script>
    const manuAvatar = "assets/dra-manu-perfil.jpg";
    const aulaUrl = "https://pages.hurtzcompany.com.br/dra-emanuele-aula-agendamento/";
    const countries = [
      { code: "BR", dial: "+55" },
      { code: "PT", dial: "+351" },
      { code: "US", dial: "+1" }
    ];
    const situations = [
      "Sou profissional da saúde, atendo pacientes, mas ainda tenho dificuldade em atrair pacientes de maior valor e aumentar meu faturamento",
      "Tenho uma clínica estruturada e faturando, mas sinto que estou abaixo do potencial e quero crescer de forma mais estratégica",
      "Minha agenda está cheia, mas sinto que trabalho muito e ganho menos do que deveria",
      "Tenho uma clínica ou operação consolidada e quero aumentar lucro, fortalecer minha marca e escalar com mais liberdade"
    ];
    const revenues = [
      "Até R$ 10 mil/mês",
      "Entre R$ 11 mil e R$ 19 mil/mês",
      "Entre R$ 20 mil e R$ 50 mil/mês",
      "Entre R$ 50 mil e R$ 75 mil/mês",
      "Entre R$ 75 mil e R$ 100 mil/mês",
      "Acima de R$ 100 mil/mês"
    ];

    const state = {
      current: 0,
      messages: [],
      answers: {},
      country: countries[0],
      error: "",
      draft: "",
      typing: false,
      botBusy: false,
      done: false,
      slot: "",
      focusInputOnRender: false,
      openPickerAfterRender: false
    };

    const steps = [
      {
        key: "nome",
        field: "nome",
        input: "text",
        label: "Seu nome",
        placeholder: "Como você gostaria de ser chamada(o)?",
        autocomplete: "name",
        autocapitalize: "words",
        thinking: "Preparando seu diagnóstico...",
        ask: () => [
          "Legal, parabéns por você ter chegado até aqui.",
          "Esta experiência foi preparada para profissionais da saúde e estética que querem construir uma clínica mais valorizada, organizada e lucrativa.",
          "Para começarmos, qual é o seu nome?"
        ],
        validate: value => value.trim().length < 2 ? "Informe seu nome." : ""
      },
      {
        key: "email",
        field: "email",
        input: "email",
        label: "Seu melhor e-mail",
        placeholder: "voce@email.com",
        autocomplete: "email",
        autocapitalize: "none",
        thinking: "Preparando seu acesso...",
        ask: data => [
          `Que bom, ${firstName(data.nome)}. Vamos ao que interessa.`,
          "Qual é o seu melhor e-mail?"
        ],
        validate: value => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value.trim()) ? "" : "Informe um e-mail válido."
      },
      {
        key: "telefone",
        field: "telefone",
        input: "phone",
        label: "Seu WhatsApp",
        placeholder: "(11) 99999-9999",
        autocomplete: "tel",
        autocapitalize: "none",
        thinking: "Validando seu contato...",
        ask: () => [
          "Perfeito. Preencha também o seu WhatsApp com DDD para continuar."
        ],
        validate: value => {
          const localDigits = stripDialCode(value).replace(/\D/g, "");
          return localDigits.length < 10 ? "Informe um telefone válido, com DDD." : "";
        }
      },
      {
        key: "instagram",
        field: "instagram",
        input: "text",
        label: "Seu Instagram",
        placeholder: "@seuinstagram",
        autocomplete: "username",
        autocapitalize: "none",
        thinking: "Conhecendo seu posicionamento...",
        ask: data => [
          `Maravilha, ${firstName(data.nome)}. Quero conhecer melhor o seu trabalho.`,
          "Qual é o seu @ do Instagram?"
        ],
        validate: value => value.trim().replace(/^@/, "").length < 2 ? "Informe seu perfil do Instagram." : ""
      },
      {
        key: "situacao",
        field: "situacao",
        input: "select",
        label: "Sua situação hoje",
        placeholder: "Selecione a opção que mais combina com você",
        options: situations,
        thinking: "Entendendo seu momento...",
        ask: () => ["Qual opção melhor descreve sua situação hoje?"]
      },
      {
        key: "faturamento",
        field: "faturamento",
        input: "select",
        label: "Faturamento médio mensal",
        placeholder: "Selecionar faixa",
        options: revenues,
        thinking: "Finalizando seu diagnóstico...",
        ask: data => [
          `Ótimo, ${firstName(data.nome)}. Entendi seu momento.`,
          "Vamos à última pergunta: hoje, qual é o faturamento médio mensal do seu negócio?"
        ]
      }
    ];

    const thread = document.getElementById("thread");
    const chatView = document.getElementById("chatView");
    const progressTrack = document.getElementById("progressTrack");
    const currentCount = document.getElementById("currentCount");
    const totalCount = document.getElementById("totalCount");

    totalCount.textContent = steps.length;

    function firstName(name) {
      return (name || "").trim().split(/\s+/)[0] || "";
    }

    function formatPhone(value) {
      const digits = stripDialCode(value).replace(/\D/g, "").slice(0, 11);
      if (digits.length <= 2) return digits;
      if (digits.length <= 6) return `(${digits.slice(0, 2)}) ${digits.slice(2)}`;
      if (digits.length <= 10) return `(${digits.slice(0, 2)}) ${digits.slice(2, 6)}-${digits.slice(6)}`;
      return `(${digits.slice(0, 2)}) ${digits.slice(2, 7)}-${digits.slice(7)}`;
    }

    function stripDialCode(value) {
      const escapedDial = state.country.dial.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return String(value || "").replace(new RegExp(`^\\s*${escapedDial}\\s*`), "");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function botAvatar() {
      return `<div class="avatar" aria-hidden="true"><img src="${manuAvatar}" alt=""></div>`;
    }

    function pushMessage(role, text) {
      state.messages.push({ role, text });
      render();
    }

    function setTyping(value) {
      state.typing = value;
      render();
    }

    function scrollBottom() {
      requestAnimationFrame(() => {
        chatView.scrollTop = chatView.scrollHeight;
        window.scrollTo(0, document.documentElement.scrollHeight);
      });
    }

    async function botSay(lines) {
      state.botBusy = true;
      for (const line of lines) {
        setTyping(true);
        await wait(190 + Math.min(line.length * 2, 280));
        state.typing = false;
        state.messages.push({ role: "bot", text: line });
        render();
        await wait(90);
      }
      state.botBusy = false;
      render();
    }

    function wait(ms) {
      return new Promise(resolve => window.setTimeout(resolve, ms));
    }

    function renderProgress() {
      const count = state.done ? steps.length : state.current;
      currentCount.textContent = count;
      progressTrack.innerHTML = steps.map((_, index) => {
        const klass = index < count ? "is-done" : index === count && !state.done ? "is-active" : "";
        return `<span class="progress-seg ${klass}"></span>`;
      }).join("");
    }

    function renderMessages() {
      const rows = state.messages.map(message => {
        const isBot = message.role === "bot";
        return `
          <div class="row ${isBot ? "row-bot" : "row-user"}">
            ${isBot ? botAvatar() : ""}
            <div class="bubble ${isBot ? "bubble-bot" : "bubble-user"}">${escapeHtml(message.text)}</div>
          </div>
        `;
      }).join("");

      const typing = state.typing ? `
        <div class="typing">
          ${botAvatar()}
          <div>
            <div class="typing-bubble"><span></span><span></span><span></span></div>
            ${currentStep()?.thinking ? `<div class="wait-note">${escapeHtml(currentStep().thinking)}</div>` : ""}
          </div>
        </div>
      ` : "";

      thread.innerHTML = rows + typing + renderInput();
      scrollBottom();
    }

    function currentStep() {
      return steps[state.current];
    }

    function renderInput() {
      if (state.typing || state.botBusy || state.done) return "";
      const step = currentStep();
      if (!step) return "";

      const error = state.error ? `<div class="error">${escapeHtml(state.error)}</div>` : "";
      const consent = state.current === 0 ? `
        <p class="consent">Prévia local do diagnóstico. As respostas ficam apenas nesta página e não são enviadas nem armazenadas.</p>
      ` : "";

      if (step.input === "select") {
        return `
          <div class="inputbar">
            ${consent}
            ${error}
            <label class="field-label">${escapeHtml(step.label)}</label>
            <button class="trigger" type="button" onclick="openPicker()">
              <span>${escapeHtml(step.placeholder)}</span>
              <strong>v</strong>
            </button>
          </div>
        `;
      }

      const isPhone = step.input === "phone";
      const inputMode = isPhone ? "tel" : step.input === "email" ? "email" : step.key === "site" ? "url" : "text";
      const type = isPhone ? "tel" : step.input === "email" ? "email" : "text";
      const autocomplete = step.autocomplete || "off";
      const autocapitalize = step.autocapitalize || "sentences";

      return `
        <div class="inputbar">
          ${consent}
          ${error}
          <label class="field-label" for="answerInput">${escapeHtml(step.label)}</label>
          <div class="field ${isPhone ? "field-phone" : ""}">
            ${isPhone ? renderCountryPicker() : ""}
            <input id="answerInput" class="text-input" type="${type}" inputmode="${inputMode}" placeholder="${escapeHtml(step.placeholder)}" value="${escapeHtml(state.draft)}" autocomplete="${autocomplete}" autocapitalize="${autocapitalize}" enterkeyhint="next" spellcheck="false">
            <button class="send" type="button" onclick="submitText()" ${state.draft.trim() ? "" : "disabled"} aria-label="Enviar">↑</button>
          </div>
          ${step.skipLabel ? `<button class="skip" type="button" onclick="submitSkip()">${escapeHtml(step.skipLabel)}</button>` : ""}
        </div>
      `;
    }

    function renderCountryPicker() {
      return `
        <div class="country">
          <button class="country-btn" type="button" onclick="toggleCountryMenu()">
            <span class="country-code">${state.country.code}</span>
            <span>${state.country.dial}</span>
            <span class="country-chev" aria-hidden="true">▾</span>
          </button>
          <div class="country-menu" id="countryMenu" hidden>
            ${countries.map(country => `
              <button type="button" onclick="selectCountry('${country.code}')">
                <span class="country-code">${country.code}</span>
                <span>${country.dial}</span>
              </button>
            `).join("")}
          </div>
        </div>
      `;
    }

    function hydrateInput() {
      const input = document.getElementById("answerInput");
      if (!input) return;
      const button = document.querySelector(".send");
      const field = input.closest(".field");
      const syncInput = () => {
        if (currentStep().input === "phone") input.value = formatPhone(input.value);
        state.draft = input.value;
        state.error = "";
        const error = document.querySelector(".error");
        if (error) error.remove();
        button.disabled = input.value.trim().length === 0;
      };
      if (field) {
        field.addEventListener("click", event => {
          if (event.target.closest(".country")) return;
          focusAnswerInput();
        });
      }
      input.addEventListener("input", syncInput);
      input.addEventListener("change", syncInput);
      input.addEventListener("keyup", syncInput);
      input.addEventListener("paste", () => requestAnimationFrame(syncInput));
      input.addEventListener("compositionend", syncInput);
      input.addEventListener("keydown", event => {
        if (event.key === "Enter" && input.value.trim()) submitText();
      });
      if (state.focusInputOnRender) {
        state.focusInputOnRender = false;
        focusAnswerInput();
      }
    }

    function focusAnswerInput() {
      const input = document.getElementById("answerInput");
      if (!input) return;
      input.focus({ preventScroll: false });
      setCaretToEnd(input);
      input.scrollIntoView({ block: "center", inline: "nearest" });
      requestAnimationFrame(() => {
        input.focus({ preventScroll: false });
        setCaretToEnd(input);
        input.scrollIntoView({ block: "center", inline: "nearest" });
      });
      window.setTimeout(() => {
        input.scrollIntoView({ block: "center", inline: "nearest" });
      }, 260);
    }

    function setCaretToEnd(input) {
      if (typeof input.setSelectionRange !== "function") return;
      const caret = input.value.length;
      input.setSelectionRange(caret, caret);
    }

    function toggleCountryMenu() {
      const menu = document.getElementById("countryMenu");
      if (menu) menu.hidden = !menu.hidden;
    }

    function selectCountry(code) {
      state.country = countries.find(country => country.code === code) || countries[0];
      state.draft = formatPhone(state.draft);
      state.focusInputOnRender = true;
      render();
    }

    function submitText() {
      const input = document.getElementById("answerInput");
      if (!input) return;
      const step = currentStep();
      let rawValue = input.value.trim();
      let label = rawValue;
      if (step.input === "phone") {
        rawValue = formatPhone(rawValue);
        label = `${state.country.dial} ${rawValue}`;
        rawValue = label;
      }
      submitAnswer(rawValue, label);
    }

    function submitSkip() {
      const step = currentStep();
      submitAnswer(step.skipValue, step.skipLabel);
    }

    async function submitAnswer(value, label) {
      const step = currentStep();
      const error = step.validate ? step.validate(value) : "";
      if (error) {
        state.error = error;
        state.draft = step.input === "phone" ? formatPhone(value) : label || value;
        state.focusInputOnRender = true;
        render();
        return;
      }

      state.error = "";
      state.draft = "";
      state.answers[step.field] = value;
      state.messages.push({ role: "user", text: label || value });
      state.current += 1;

      if (state.current >= steps.length) {
        render();
        await finish();
        return;
      }

      const nextStep = currentStep();
      await botSay(nextStep.ask(state.answers));
      state.focusInputOnRender = nextStep.input !== "select";
      state.openPickerAfterRender = nextStep.input === "select";
      render();
    }

    function openPicker() {
      const step = currentStep();
      const modal = document.createElement("div");
      modal.className = "modal-backdrop";
      modal.id = "picker";
      modal.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
          <div class="modal-head">
            <div>
              <h2 class="modal-title" id="pickerTitle">${escapeHtml(step.label)}</h2>
              <p class="modal-sub">Selecione uma opção para continuar</p>
            </div>
            <button class="modal-close" type="button" onclick="closePicker()" aria-label="Fechar">×</button>
          </div>
          ${step.options.length > 12 ? '<input class="search" id="pickerSearch" placeholder="Buscar..." autocomplete="off">' : ""}
          <div class="option-list" id="optionList"></div>
        </div>
      `;
      document.body.appendChild(modal);
      renderOptions("");
      const search = document.getElementById("pickerSearch");
      if (search) {
        search.focus();
        search.addEventListener("input", () => renderOptions(search.value));
      }
    }

    function renderOptions(query) {
      const step = currentStep();
      const list = document.getElementById("optionList");
      if (!list) return;
      const normalized = query.trim().toLowerCase();
      const options = normalized ? step.options.filter(option => option.toLowerCase().includes(normalized)) : step.options;
      list.innerHTML = options.length ? options.map(option => `
        <button class="option" type="button" onclick="pickOption('${encodeURIComponent(option)}')">
          <span>${escapeHtml(option)}</span>
          <span aria-hidden="true">→</span>
        </button>
      `).join("") : '<div class="empty">Nada encontrado.</div>';
    }

    function closePicker() {
      const picker = document.getElementById("picker");
      if (picker) picker.remove();
    }

    function pickOption(encoded) {
      const value = decodeURIComponent(encoded);
      const step = currentStep();
      closePicker();
      submitAnswer(value, value);
    }

    async function finish() {
      state.done = true;
      window.location.assign(aulaUrl);
    }

    function render() {
      renderProgress();
      renderMessages();
      hydrateInput();
      if (state.openPickerAfterRender && !document.getElementById("picker")) {
        state.openPickerAfterRender = false;
        openPicker();
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => {
        if (document.activeElement?.id === "answerInput") {
          focusAnswerInput();
        }
      });
    }

    async function init() {
      render();
      await botSay(currentStep().ask(state.answers));
      state.focusInputOnRender = true;
      render();
    }

    init();
  </script>
</body>
</html>
