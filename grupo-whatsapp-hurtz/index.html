<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F4F4F4">
  <meta name="description" content="Entrar no grupo Lançamento chácaras Refúgio do Lago pelo WhatsApp.">
  <meta property="og:title" content="Lançamento chácaras Refúgio do Lago">
  <meta property="og:description" content="Toque para entrar no grupo pelo WhatsApp.">
  <meta property="og:image" content="assets/foto-grupo.jpg">
  <meta property="og:type" content="website">
  <title>Lançamento chácaras Refúgio do Lago</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #F4F4F4;
      --text: #333333;
      --muted: #4D4D4D;
      --line: #D0D0D0;
      --green: #87E986;
      --green-hover: #72D972;
      --topbar: #42364E;
      --link: #0057B8;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: Inter, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .topbar {
      width: 100%;
      height: 30px;
      background: var(--topbar);
    }

    main {
      min-height: calc(100vh - 30px);
      display: flex;
      justify-content: center;
      padding: 88px 20px 48px;
    }

    .invite {
      width: min(100%, 560px);
      text-align: center;
    }

    .avatar {
      width: clamp(190px, 32vw, 300px);
      aspect-ratio: 1;
      margin: 0 auto 70px;
      border-radius: 50%;
      overflow: hidden;
      background: #111016;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    h1 {
      margin: 0 auto 56px;
      max-width: 640px;
      color: var(--text);
      font-size: clamp(34px, 5vw, 48px);
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: 0;
    }

    .actions {
      display: grid;
      gap: 28px;
      margin: 0 auto;
    }

    .button {
      width: 100%;
      min-height: 86px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      font: inherit;
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 400;
      line-height: 1.1;
      text-decoration: none;
      cursor: pointer;
    }

    .enter {
      border: 1px solid #A7F4A5;
      background: var(--green);
      color: #111016;
    }

    .enter:hover { background: var(--green-hover); }

    .copy {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
    }

    .copy.copied {
      border-color: var(--green-hover);
      background: #ECFFEC;
    }

    .help {
      max-width: 520px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(19px, 3vw, 24px);
      line-height: 1.42;
    }

    .help a {
      color: var(--link);
      text-decoration: none;
    }

    @media (max-width: 560px) {
      .topbar { height: 24px; }

      main {
        min-height: calc(100vh - 24px);
        padding: 52px 20px 34px;
      }

      .avatar {
        width: 190px;
        margin-bottom: 48px;
      }

      h1 {
        margin-bottom: 40px;
        font-size: 32px;
      }

      .actions { gap: 18px; }

      .button {
        min-height: 68px;
        border-radius: 12px;
        font-size: 25px;
      }

      .help { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="topbar" aria-hidden="true"></div>

  <main>
    <section class="invite" aria-label="Convite do grupo no WhatsApp">
      <div class="avatar">
        <img src="assets/foto-grupo.jpg" alt="Foto do grupo Lançamento chácaras Refúgio do Lago">
      </div>

      <h1>Lançamento chácaras Refúgio do Lago</h1>

      <div class="actions">
        <a class="button enter" id="enter-group" href="https://chat.whatsapp.com/Ifu9SAw0OztDD5rbzgZbPj?mode=gi_t" rel="noopener">Entrar</a>
        <button class="button copy" id="copy-link" type="button">Copiar o link do grupo</button>
      </div>

      <p class="help">
        Caso esteja com problemas para entrar no grupo,<br>
        abra o WhatsApp e cole o link em uma conversa.<br>
        Então clique no link para abrir direto no grupo.
      </p>
    </section>
  </main>

  <script>
    (function () {
      var groupCode = 'Ifu9SAw0OztDD5rbzgZbPj';
      var groupUrl = 'https://chat.whatsapp.com/' + groupCode + '?mode=gi_t';
      var appUrl = 'whatsapp://chat/?code=' + groupCode;
      var androidIntent = 'intent://chat/?code=' + groupCode +
        '#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url=' +
        encodeURIComponent(groupUrl) + ';end';

      var ua = navigator.userAgent || navigator.vendor || '';
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isMobile = isAndroid || isIOS || /Mobi|Mobile/i.test(ua);
      var hasLeftPage = false;

      var enterButton = document.getElementById('enter-group');
      var copyButton = document.getElementById('copy-link');

      function bestTarget() {
        if (isAndroid) return androidIntent;
        if (isIOS || isMobile) return appUrl;
        return groupUrl;
      }

      function openGroup(event) {
        if (event) event.preventDefault();
        window.location.href = bestTarget();
      }

      function copyLink() {
        function done() {
          copyButton.textContent = 'Link copiado';
          copyButton.classList.add('copied');
          setTimeout(function () {
            copyButton.textContent = 'Copiar o link do grupo';
            copyButton.classList.remove('copied');
          }, 1800);
        }

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(groupUrl).then(done).catch(function () {
            window.prompt('Copie o link do grupo:', groupUrl);
          });
          return;
        }

        window.prompt('Copie o link do grupo:', groupUrl);
      }

      enterButton.href = groupUrl;
      enterButton.addEventListener('click', openGroup);
      copyButton.addEventListener('click', copyLink);

      window.addEventListener('pagehide', function () { hasLeftPage = true; });
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) hasLeftPage = true;
      });

      setTimeout(openGroup, 250);

      setTimeout(function () {
        if (!hasLeftPage && isMobile) {
          window.location.href = groupUrl;
        }
      }, 1400);
    })();
  </script>
</body>
</html>
