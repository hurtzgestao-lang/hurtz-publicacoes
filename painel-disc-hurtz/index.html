<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Painel DISC interno · Hurtz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--brasa:#C06018;--brasa-dark:#974A12;--brasa-soft:#F9EDE3;--carvao:#181614;--grafite:#3D3A36;--pedra:#8C8880;--areia:#E8E4DC;--offwhite:#F5F2EC;--green:#1A7A4A;--font:Inter,Arial,sans-serif;--max:1260px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--offwhite);color:var(--carvao);font-family:var(--font);font-size:14px;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer}.app{width:100%;max-width:var(--max);margin:0 auto;padding:24px 24px 64px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:24px;border-bottom:1px solid var(--areia);margin-bottom:42px}.logo{width:118px;height:auto;display:block}.eyebrow{margin:0 0 12px;color:var(--brasa);font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.brand-rule{height:2px;width:48px;background:var(--brasa);margin-bottom:20px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-bottom:30px}.hero h1{margin:0;font-size:clamp(31px,5vw,52px);line-height:1;letter-spacing:-.045em}.hero p{max-width:500px;margin:14px 0 0;color:var(--grafite)}.token-card,.filters,.table-card,.detail{background:#fff;border:1px solid var(--areia);border-radius:4px;padding:24px}.token-card{max-width:620px;margin:60px auto}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:700}.field input,.filters input,.filters select{width:100%;padding:12px 13px;border:1px solid var(--areia);border-radius:2px;background:#fff;color:var(--carvao);outline:none}.field input:focus,.filters input:focus,.filters select:focus{border-color:var(--carvao)}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.actions.spread{justify-content:space-between}.btn{border:0;border-radius:2px;padding:12px 16px;font-weight:700;transition:background-color 120ms ease,color 120ms ease}.btn-primary{background:var(--brasa);color:#fff}.btn-primary:hover{background:var(--brasa-dark)}.btn-secondary{background:transparent;border:1.5px solid var(--carvao);color:var(--carvao)}.btn-secondary:hover{background:var(--carvao);color:var(--offwhite)}.error{margin:12px 0 0;color:#B52A2A;font-size:13px;font-weight:700}.muted{color:var(--pedra);font-size:12px}.hidden{display:none!important}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:0 0 24px}.metric{background:var(--carvao);color:var(--offwhite);border:1px solid var(--carvao);padding:18px}.metric strong{display:block;font-size:30px;line-height:1}.metric span{display:block;margin-top:6px;color:#c9c1b8;font-size:11px;text-transform:uppercase;letter-spacing:.08em}.metric.d{border-top:3px solid var(--brasa)}.metric.i{border-top:3px solid #D48444}.metric.s{border-top:3px solid var(--green)}.metric.c{border-top:3px solid #3A6FBF}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;align-items:end;gap:12px;margin-bottom:24px}.table-card{padding:0;overflow:hidden}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:15px 16px;border-bottom:1px solid var(--areia);text-align:left;vertical-align:top}.table th{background:var(--brasa-soft);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.table td{color:var(--grafite)}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#fcfaf7}.profile{display:inline-flex;align-items:center;gap:7px;padding:5px 8px;border-radius:999px;background:var(--brasa-soft);color:var(--brasa-dark);font-size:11px;font-weight:700}.profile-dot{width:7px;height:7px;border-radius:50%;background:currentColor}.row-action{padding:7px 10px;border:1px solid var(--areia);border-radius:2px;background:#fff;color:var(--carvao);font-size:12px;font-weight:700}.row-action:hover{border-color:var(--brasa);color:var(--brasa-dark)}.detail{margin-top:24px}.detail-head{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--areia);padding-bottom:18px}.detail h2{margin:0;font-size:27px;line-height:1.05}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:24px}.detail-section{border-top:2px solid var(--brasa);padding-top:12px}.detail-section h3{margin:0 0 8px;font-size:14px}.detail-section p{margin:0;color:var(--grafite)}.detail-section ul{margin:0;padding-left:18px;color:var(--grafite)}.detail-section li+li{margin-top:6px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.answer{border:1px solid var(--areia);padding:10px 12px}.answer small{display:block;color:var(--pedra);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.answer span{display:block;margin-top:3px;color:var(--grafite);font-size:12px}.empty{text-align:center;padding:40px;color:var(--pedra)}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.hero{display:block}.detail-grid{grid-template-columns:1fr}}@media(max-width:520px){.app{padding:16px 14px 40px}.topbar{margin-bottom:30px}.token-card,.filters,.detail{padding:18px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:14px}.metric strong{font-size:25px}.filters{grid-template-columns:1fr}.filters .search{grid-column:auto}.answers{grid-template-columns:1fr}.actions.spread{align-items:flex-start;flex-direction:column}.actions.spread .btn{width:100%}}@media print{body{background:#fff}.dashboard-only{display:none!important}.app{max-width:none;padding:0}.detail{border:0;padding:0;margin:0}.detail-head .actions{display:none}.detail-grid{grid-template-columns:1fr 1fr}.answer{break-inside:avoid}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><img class="logo" src="logo-atual-claro.png" alt="Hurtz Company"><span class="muted">Painel privado · DISC interno</span></header>
    <section id="app" aria-live="polite"></section>
  </main>
  <script>
    const API_URL = "https://uxttihjsxfowursjyult.supabase.co/functions/v1/disc-dashboard";
    const TOKEN_KEY = "hurtz-disc-dashboard-token";
    const app = document.getElementById("app");
    let token = new URLSearchParams(window.location.search).get("token") || sessionStorage.getItem(TOKEN_KEY) || "";
    let rows = [];
    let selected = null;
    if(token){ sessionStorage.setItem(TOKEN_KEY, token); history.replaceState({}, "", window.location.pathname); }
    function esc(value){ return String(value ?? "").replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char])); }
    function list(items){ return `<ul>${(items||[]).map(item => `<li>${esc(item)}</li>`).join("")}</ul>`; }
    function render(){ if(!token) return renderGate(); if(selected) return renderDashboard(true); renderDashboard(false); }
    function renderGate(message=""){
      app.innerHTML = `<section class="token-card"><p class="eyebrow">Acesso restrito</p><div class="brand-rule"></div><h1 style="margin:0;font-size:31px;line-height:1.05">Painel de resultados DISC</h1><p style="color:var(--grafite);margin:14px 0 24px">Cole o token privado do painel para visualizar os resultados da equipe.</p><div class="field"><label for="token">Token de acesso</label><input id="token" type="password" autocomplete="off" placeholder="Token privado"></div><p class="error">${esc(message)}</p><div class="actions" style="margin-top:22px"><button class="btn btn-primary" id="enter">Entrar no painel →</button></div></section>`;
      document.getElementById("enter").addEventListener("click", () => { const value=document.getElementById("token").value.trim(); if(!value){ renderGate("Informe o token privado."); return; } token=value; sessionStorage.setItem(TOKEN_KEY,token); render(); });
    }
    async function loadRows(){
      app.innerHTML = `<section class="token-card"><div class="loader" style="width:34px;height:34px;border:3px solid var(--areia);border-top-color:var(--brasa);border-radius:50%;animation:spin .8s linear infinite"></div><p class="muted" style="margin-top:18px">Carregando resultados...</p></section>`;
      try{ const response=await fetch(API_URL,{headers:{"x-dashboard-token":token}}); const data=await response.json().catch(()=>({})); if(response.status===401){sessionStorage.removeItem(TOKEN_KEY);token="";renderGate("Token inválido ou expirado.");return;} if(!response.ok||!data.success) throw new Error(data.error||"Não foi possível carregar o painel."); rows=data.rows||[]; renderDashboard(false); }catch(error){ app.innerHTML=`<section class="token-card"><p class="eyebrow">Erro de carregamento</p><h1 style="margin:0;font-size:30px">Não foi possível abrir o painel.</h1><p class="error">${esc(error.message)}</p><div class="actions" style="margin-top:22px"><button class="btn btn-secondary" id="retry">Tentar novamente</button></div></section>`; document.getElementById("retry").addEventListener("click",loadRows); }
    }
    function renderDashboard(showDetail){
      const filtered = getFilteredRows();
      const counts={D:0,I:0,S:0,C:0}; rows.forEach(row=>{if(counts[row.profile_code]!==undefined)counts[row.profile_code]++;});
      app.innerHTML = `<section class="hero dashboard-only"><div><p class="eyebrow">Visão da equipe</p><div class="brand-rule"></div><h1>Resultados DISC</h1><p>Leitura completa dos diagnósticos internos registrados pela Hurtz.</p></div><div class="actions"><button class="btn btn-secondary" id="refresh">Atualizar</button><button class="btn btn-primary" id="csv">Exportar CSV →</button></div></section><section class="metrics dashboard-only"><div class="metric"><strong>${rows.length}</strong><span>avaliações</span></div><div class="metric d"><strong>${counts.D}</strong><span>Dominância</span></div><div class="metric i"><strong>${counts.I}</strong><span>Influência</span></div><div class="metric s"><strong>${counts.S}</strong><span>Estabilidade</span></div><div class="metric c"><strong>${counts.C}</strong><span>Conformidade</span></div></section><section class="filters dashboard-only"><div class="field search"><label for="q">Buscar nome ou e-mail</label><input id="q" type="search" placeholder="Digite para filtrar"></div><div class="field"><label for="profile">Perfil</label><select id="profile"><option value="">Todos</option><option value="D">D · Dominância</option><option value="I">I · Influência</option><option value="S">S · Estabilidade</option><option value="C">C · Conformidade</option></select></div><div class="field"><label for="from">A partir de</label><input id="from" type="date"></div><div class="field"><label for="to">Até</label><input id="to" type="date"></div><button class="btn btn-secondary" id="filter">Filtrar</button></section><section class="table-card dashboard-only"><div class="table-wrap"><table class="table"><thead><tr><th>Colaborador</th><th>Perfil</th><th>Scores</th><th>Data</th><th></th></tr></thead><tbody>${filtered.length?filtered.map(row=>rowHtml(row)).join(""):"<tr><td colspan=\"5\"><div class=\"empty\">Nenhum resultado encontrado.</div></td></tr>"}</tbody></table></div></section>${showDetail?detailHtml(selected):""}`;
      document.getElementById("refresh")?.addEventListener("click",loadRows); document.getElementById("csv")?.addEventListener("click",()=>downloadCsv(filtered)); document.getElementById("filter")?.addEventListener("click",()=>renderDashboard(false));
      document.querySelectorAll("[data-row]").forEach(button=>button.addEventListener("click",()=>{selected=rows.find(row=>row.id===button.dataset.row)||null;renderDashboard(true);}));
      document.getElementById("close-detail")?.addEventListener("click",()=>{selected=null;renderDashboard(false);}); document.getElementById("print-detail")?.addEventListener("click",()=>window.print()); document.getElementById("download-detail")?.addEventListener("click",()=>downloadRow(selected));
    }
    function rowHtml(row){ const scores=row.scores||{}; return `<tr><td><strong>${esc(row.nome)}</strong><br><span class="muted">${esc(row.email)}</span></td><td><span class="profile"><span class="profile-dot"></span>${esc(row.profile_code)} · ${esc(row.profile_label)}</span></td><td>D ${scores.D||0} · I ${scores.I||0} · S ${scores.S||0} · C ${scores.C||0}</td><td>${formatDate(row.created_at)}</td><td><button class="row-action" data-row="${esc(row.id)}">Ver resultado</button></td></tr>`; }
    function getFilteredRows(){ const q=(document.getElementById("q")?.value||"").trim().toLowerCase(); const profile=document.getElementById("profile")?.value||""; const from=document.getElementById("from")?.value||""; const to=document.getElementById("to")?.value||""; return rows.filter(row=>(!q||`${row.nome} ${row.email}`.toLowerCase().includes(q))&&(!profile||row.profile_code===profile)&&(!from||row.created_at.slice(0,10)>=from)&&(!to||row.created_at.slice(0,10)<=to)); }
    function detailHtml(row){ const report=row.report||{}; const scores=row.scores||{}; const answerData=row.answers||{}; const labels=answerData.labels||{}; const selections=answerData.selections||answerData; return `<section class="detail" id="detail"><div class="detail-head"><div><p class="eyebrow">Resultado individual</p><h2>${esc(row.nome)}</h2><p class="muted">${esc(row.email)} · ${formatDate(row.created_at)} · ${esc(row.profile_label)}</p></div><div class="actions"><button class="btn btn-secondary" id="close-detail">Fechar</button><button class="btn btn-secondary" id="download-detail">Baixar .txt</button><button class="btn btn-primary" id="print-detail">Baixar PDF →</button></div></div><div class="detail-grid"><div class="detail-section"><h3>Perfil e scores</h3><p><strong>${esc(row.profile_code)} · ${esc(row.profile_label)}</strong><br>D ${scores.D||0} · I ${scores.I||0} · S ${scores.S||0} · C ${scores.C||0}</p></div><div class="detail-section"><h3>Resumo</h3><p>${esc(report.summary||"")}</p></div><div class="detail-section"><h3>Forças naturais</h3>${list(report.strengths)}</div><div class="detail-section"><h3>Pontos de atenção</h3>${list(report.attention_points)}</div><div class="detail-section"><h3>Comunicação</h3><p>${esc(report.communication||"")}</p></div><div class="detail-section"><h3>Impacto na Hurtz</h3><p>${esc(report.hurtz_impact||"")}</p></div><div class="detail-section"><h3>Recomendações</h3>${list(report.recommendations)}</div><div class="detail-section"><h3>24 respostas</h3><div class="answers">${Object.keys(selections).sort().map(id=>`<div class="answer"><small>${esc(id)} · ${esc(selections[id])}</small><span>${esc(labels[id]||"Resposta registrada")}</span></div>`).join("")}</div></div></div><div class="detail-section" style="margin-top:24px"><p class="muted">${esc(report.disclaimer||"")}</p></div></section>`; }
    function formatDate(value){ try{return new Intl.DateTimeFormat("pt-BR",{dateStyle:"short",timeStyle:"short"}).format(new Date(value));}catch{return value||"-";} }
    function reportText(row){ const p=row.report||{}; const s=row.scores||{}; const a=row.answers||{}; return [`DIAGNÓSTICO DISC INTERNO · HURTZ`,`Nome: ${row.nome}`,`E-mail: ${row.email}`,`Perfil: ${row.profile_label} (${row.profile_code})`,`Scores: D ${s.D||0} · I ${s.I||0} · S ${s.S||0} · C ${s.C||0}`,``,p.summary||"","FORÇAS",...(p.strengths||[]).map(x=>`- ${x}`),``,`PONTOS DE ATENÇÃO`,...(p.attention_points||[]).map(x=>`- ${x}`),``,`COMUNICAÇÃO`,p.communication||"","","IMPACTO NA HURTZ",p.hurtz_impact||"","","RECOMENDAÇÕES",...(p.recommendations||[]).map(x=>`- ${x}`),``,`RESPOSTAS`,...Object.entries(a.labels||{}).sort().map(([id,label])=>`- ${id}: ${label}`),``,p.disclaimer||""].join("\n"); }
    function downloadRow(row){ const blob=new Blob([reportText(row)],{type:"text/plain;charset=utf-8"}); const url=URL.createObjectURL(blob); const link=document.createElement("a"); link.href=url; link.download=`diagnostico-disc-${row.nome.toLowerCase().replace(/[^a-z0-9]+/g,"-")}.txt`; link.click(); URL.revokeObjectURL(url); }
    function csvCell(value){ return `"${String(value??"").replace(/"/g,'""')}"`; }
    function downloadCsv(data){ const header=["id","data","nome","email","perfil","perfil_label","D","I","S","C","resumo"]; const lines=[header.map(csvCell).join(","),...data.map(row=>{const s=row.scores||{};return [row.id,row.created_at,row.nome,row.email,row.profile_code,row.profile_label,s.D||0,s.I||0,s.S||0,s.C||0,row.report?.summary||""].map(csvCell).join(",");})]; const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"}); const url=URL.createObjectURL(blob); const link=document.createElement("a"); link.href=url; link.download=`resultados-disc-${new Date().toISOString().slice(0,10)}.csv`; link.click(); URL.revokeObjectURL(url); }
    render(); if(token) loadRows();
  </script>
</body>
</html>
