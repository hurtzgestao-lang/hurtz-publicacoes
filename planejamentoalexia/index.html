<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" sizes="256x256" href="assets/alexia-favicon.png">
  <link rel="apple-touch-icon" href="assets/alexia-favicon.png">
  <title>Alexia Clinic | Planejamento de conteúdo</title>
  <style>
    :root { --orange:#c06018; --ink:#181614; --muted:#6b665f; --line:#e8e4dc; --soft:#f7f5f1; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#fff; font-family:Garamond,"EB Garamond",Georgia,serif; }
    button { font:inherit; }
    .topline { height:5px; background:var(--orange); }
    header { border-bottom:1px solid var(--line); }
    .header-inner { max-width:1280px; margin:auto; padding:34px 32px 14px; animation:rise .7s cubic-bezier(.2,.8,.2,1) both; }
    .brand { color:var(--orange); font-family:Inter,ui-sans-serif,system-ui,sans-serif; font-size:11px; font-weight:800; letter-spacing:.13em; }
    h1 { margin:9px 0 0; font-size:clamp(30px,4vw,50px); line-height:1.02; letter-spacing:-.04em; }
    .control-bar { max-width:1280px; margin:auto; padding:0 32px 20px; display:grid; grid-template-columns:290px 1fr; gap:60px; align-items:start; animation:rise .7s .08s cubic-bezier(.2,.8,.2,1) both; }
    .control-block { border-top:1px solid var(--line); padding-top:14px; }
    .control-block.right { text-align:right; }
    .control-block.right .filters { justify-content:flex-end; }
    .layout { max-width:1280px; margin:auto; padding:38px 32px 64px; display:block; }
    aside { border-right:1px solid var(--line); padding-right:28px; animation:rise .7s .1s cubic-bezier(.2,.8,.2,1) both; }
    .aside-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .aside-title strong { font-family:Inter,ui-sans-serif,system-ui,sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    .count { color:var(--orange); font-size:12px; font-weight:700; }
    .filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
    .filter { border:0; border-bottom:1px solid var(--line); background:#fff; color:var(--muted); padding:7px 2px; margin-right:10px; cursor:pointer; font-size:12px; transition:color .2s,border-color .2s; }
    .filter.active, .filter:hover { color:var(--ink); border-color:var(--orange); }
    .day-list { display:grid; }
    .day { display:grid; grid-template-columns:70px 1fr; gap:13px; padding:16px 0; border-top:1px solid var(--line); background:#fff; border-left:3px solid transparent; text-align:left; cursor:pointer; transition:padding .25s,background .25s,border-color .25s; }
    .day:hover { border-left-color:var(--orange); padding-left:9px; }
    .day.selected { border-left-color:var(--orange); padding-left:9px; background:var(--soft); }
    .day-date { color:var(--orange); font-weight:800; font-size:12px; }
    .day-week { color:var(--muted); font-size:11px; margin-top:3px; }
    .day-title { font-size:14px; font-weight:750; line-height:1.25; }
    .day-format { color:var(--muted); font-size:12px; margin-top:5px; line-height:1.35; }
    .calendar-head { display:flex; justify-content:space-between; align-items:center; margin:0 0 14px; }
    .calendar-month { font-size:18px; font-weight:800; letter-spacing:-.02em; }
    .calendar-caption { color:var(--muted); font-size:12px; }
    .calendar-week { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:5px; }
    .calendar-week span { color:var(--muted); font-family:Inter,ui-sans-serif,system-ui,sans-serif; font-size:10px; font-weight:800; text-align:center; text-transform:uppercase; }
    .calendar { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    .calendar-day { min-width:0; width:25px; height:25px; border:1px solid transparent; border-radius:50%; background:#fff; color:var(--ink); cursor:pointer; font-size:12px; position:relative; transition:background .2s,border-color .2s,color .2s,transform .2s; }
    .calendar-day:hover:not(:disabled) { border-color:var(--orange); transform:translateY(-2px); }
    .calendar-day.available::after { content:""; width:3px; height:3px; background:var(--orange); border-radius:50%; position:absolute; bottom:3px; left:50%; transform:translateX(-50%); }
    .calendar-day.selected { background:var(--orange); color:#fff; font-weight:800; }
    .calendar-day.selected::after { background:#fff; }
    .calendar-day:disabled { color:#c8c2b9; cursor:default; }
    main { min-width:0; animation:rise .75s .18s cubic-bezier(.2,.8,.2,1) both; }
    .detail-kicker { color:var(--orange); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .detail h2 { font-size:clamp(36px,5vw,64px); line-height:.98; letter-spacing:-.04em; margin:10px 0 14px; max-width:900px; }
    .detail-intro { color:var(--muted); max-width:820px; font-size:20px; line-height:1.45; margin:0 0 32px; }
    .meta { display:flex; flex-wrap:wrap; gap:10px 24px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:14px 0; margin-bottom:28px; }
    .meta span { font-size:15px; color:var(--muted); }
    .meta b { color:var(--ink); margin-left:4px; }
    .option-switcher { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 22px; }
    .option-button { border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--muted); padding:8px 14px; cursor:pointer; font-family:Inter,ui-sans-serif,system-ui,sans-serif; font-size:12px; transition:background .2s,color .2s,border-color .2s,transform .2s; }
    .option-button:hover { border-color:var(--orange); color:var(--ink); transform:translateY(-1px); }
    .option-button.active { background:var(--orange); border-color:var(--orange); color:#fff; }
    .script-grid { display:block; max-width:900px; }
    .section { border-top:2px solid var(--ink); padding-top:12px; margin-top:26px; }
    .section h3 { margin:0 0 9px; font-family:Inter,ui-sans-serif,system-ui,sans-serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--orange); }
    .section p { margin:0; font-size:19px; line-height:1.58; }
    .script { white-space:pre-line; }
    .empty { color:var(--muted); padding:30px 0; }
    footer { max-width:1280px; margin:auto; padding:0 32px 26px; color:var(--muted); font-size:11px; }
    .detail.swap { animation:detailIn .42s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes detailIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes load { from { transform:translateX(-100%); } to { transform:translateX(0); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
    @media (min-width:821px) {
      .control-bar { grid-template-columns:260px minmax(0,680px); justify-content:space-between; gap:38px; padding-bottom:12px; }
      .control-block { padding-top:9px; }
      .calendar-week { gap:2px; margin-bottom:2px; }
      .calendar { gap:2px; }
      .calendar-day { width:22px; height:22px; font-size:11px; }
      .calendar-day.available::after { width:3px; height:3px; bottom:2px; }
      .layout { padding-top:26px; }
      .control-block.right { max-width:680px; }
    }
    @media (max-width:820px) {
      .header-inner { padding:22px 20px; display:block; }
      .header-note { text-align:left; margin-top:12px; }
      .progress { justify-content:flex-start; }
      .control-bar { padding:0 20px 20px; display:block; }
      .control-block.right { text-align:left; margin-top:22px; }
      .control-block.right .filters { justify-content:flex-start; }
      .layout { display:block; padding:28px 20px 52px; }
      aside { border-right:0; border-bottom:1px solid var(--line); padding:0 0 18px; margin-bottom:28px; }
      .day-list { grid-template-columns:1fr 1fr; gap:0 16px; }
      .day:nth-child(-n+2) { border-top:0; }
      .script-grid { grid-template-columns:1fr; gap:22px; }
      .section.full { grid-column:auto; }
      footer { padding:0 20px 22px; }
    }
    @media (max-width:480px) { .day-list { grid-template-columns:1fr; } .day:nth-child(2) { border-top:1px solid var(--line); } }
  </style>
</head>
<body>
  <div class="topline"></div>
  <header><div class="header-inner">
    <div><div class="brand">HURTZ COMPANY / ALEXIA CLINIC</div><h1>Planejamento de conteúdo</h1></div>
  </div><div class="control-bar">
    <div class="control-block"><div class="calendar-head"><span class="calendar-month">Setembro 2026</span><span class="calendar-caption">Selecione um dia</span></div><div class="calendar-week"><span>seg</span><span>ter</span><span>qua</span><span>qui</span><span>sex</span><span>sáb</span><span>dom</span></div><div class="calendar" id="calendar"></div></div>
    <div class="control-block right"><div class="aside-title"><strong>Tipos de vídeo</strong></div><div class="filters" id="filters"></div></div>
  </div></header>
  <div class="layout">
    <main class="detail" id="detail"></main>
  </div>
  <footer>HURTZ COMPANY · Alexia Clinic · Conteúdo atualizado em 17/09/2026</footer>
  <script>
    const videos = [
      {date:'18/09',week:'sexta',theme:'Otomodelação',title:'A avaliação é o primeiro passo',format:'Reels · fala para a câmera',duration:'30–40s',focus:'Apresentar a avaliação como primeiro passo.',hook:'Se você se incomoda com as orelhas abertas, talvez já tenha pensado que a única opção seria conviver com isso.',script:'Aqui na Alexia Clinic, a avaliação serve para entender o seu caso com calma. A gente conversa sobre possibilidades, naturalidade e o que realmente faz sentido para você. O objetivo é orientar o próximo passo com segurança, respeitando a sua história e os seus limites.',visual:'Dra. Alexia no consultório, plano médio, com cortes do ambiente e dos materiais organizados.',cta:'Se isso faz sentido para você, fale com a nossa equipe e agende sua avaliação.'},
      {date:'19/09',week:'sábado',theme:'Prova social',title:'Uma história de confiança',format:'Depoimento ou narração',duration:'25–35s',focus:'Contar uma história real sem prometer resultado.',hook:'Ela chegou com um incômodo antigo e saiu dando um passo importante para a própria confiança.',script:'Cada paciente chega com uma história. Algumas querem prender o cabelo sem insegurança. Outras querem se sentir melhor nas fotos ou simplesmente parar de pensar nisso todos os dias. Aqui, a gente conduz esse processo com avaliação, cuidado e naturalidade.',visual:'Paciente autorizada falando uma frase curta, intercalada com bastidores e Dra. Alexia acompanhando.',cta:'Agende sua avaliação e converse com a nossa equipe.'},
      {date:'20/09',week:'domingo',theme:'Otomodelação',title:'Quando procurar avaliação?',format:'Vídeo educativo · Stories',duration:'Até 40s',focus:'Responder uma dúvida comum sobre orelhas abertas.',hook:'Orelhas abertas: quando vale procurar avaliação?',script:'Se esse incômodo aparece nas fotos, ao prender o cabelo ou na rotina, já vale conversar com um especialista. A avaliação ajuda a entender o seu caso e as possibilidades com mais clareza, sem decisão precipitada.',visual:'Dra. Alexia olhando para a câmera, com uma versão mais espontânea para Stories.',cta:'Se ficou com dúvida, fale com a nossa equipe.'},
      {date:'21/09',week:'segunda',theme:'Otomodelação',title:'Para quem já pensa em corrigir',format:'Reels de identificação',duration:'30–40s',focus:'Falar com quem adia a decisão.',hook:'Se você já pensou em corrigir as orelhas abertas, talvez esteja esperando o momento certo.',script:'Não precisa decidir tudo hoje. O primeiro passo pode ser apenas entender como funciona, conversar sobre o seu caso e descobrir se a otomodelação faz sentido para você. Informação e avaliação ajudam a escolher com calma.',visual:'Plano médio, olhar direto para a lente e pausa entre o gancho e a explicação.',cta:'Comece pela avaliação.'},
      {date:'22/09',week:'terça',theme:'Avaliação facial',title:'Papada e contorno facial',format:'Reels educativo',duration:'30s',focus:'Explicar por que avaliar antes de escolher.',hook:'Papada e perda de contorno facial não devem ser tratadas no chute.',script:'Antes de escolher qualquer procedimento, é importante entender pele, volume, flacidez e expectativa. Na avaliação, a gente olha para o seu caso e orienta o caminho mais adequado, sem exagero e sem promessa milagrosa.',visual:'Dra. Alexia em plano médio; imagens de apoio da avaliação sem identificar paciente.',cta:'Fale com a equipe e veja os horários disponíveis.'},
      {date:'23/09',week:'quarta',theme:'Mentoria',title:'O convite para profissionais',format:'Reels · convite',duration:'40–50s',focus:'Apresentar a mentoria Ear Line Avançado.',hook:'Você, profissional da estética avançada, já pensou em levar a otomodelação para a sua clínica?',script:'A Mentoria Alexia Clinic foi criada para profissionais que querem aprender método, indicação, experiência do paciente e posicionamento. A ideia é entender como oferecer otomodelação com condução técnica e responsabilidade.',visual:'Dra. Alexia em plano médio, detalhes de aula, materiais e orientação de aluna.',cta:'Envie uma mensagem para entender como participar.'},
      {date:'24/09',week:'quinta',theme:'Otomodelação',title:'Medo, recuperação e naturalidade',format:'Vídeo de objeção',duration:'30–40s',focus:'Responder uma pergunta por vez.',hook:'A otomodelação precisa ficar natural? Sim, e é por isso que a avaliação importa.',script:'Cada caso precisa ser avaliado individualmente. A conversa ajuda a alinhar expectativa, entender possibilidades e explicar os cuidados envolvidos. Naturalidade não é uma promessa pronta: é algo que precisa ser planejado para cada pessoa.',visual:'Pergunta na tela e resposta direta da Dra. Alexia. Um take para cada dúvida.',cta:'Salve esta dúvida e converse com a equipe na sua avaliação.'},
      {date:'25/09',week:'sexta',theme:'Prova social',title:'A paciente e o próprio processo',format:'Depoimento autorizado',duration:'25–35s',focus:'Mostrar emoção e fala natural.',hook:'Uma mudança pode começar quando a pessoa decide olhar para um incômodo com cuidado.',script:'Deixar a paciente contar, com as próprias palavras, o que a trouxe até a clínica e como foi ser acolhida durante o processo. A Dra. Alexia pode fechar falando sobre escuta, avaliação e cuidado.',visual:'Paciente autorizada, sem pedir frases decoradas ou comparações exageradas.',cta:'Cada história é única. Agende uma avaliação.'},
      {date:'26/09',week:'sábado',theme:'Famílias',title:'Uma conversa para responsáveis',format:'Reels para mães e responsáveis',duration:'35–45s',focus:'Acolher famílias que pensam em outubro.',hook:'Tem criança ou adolescente que sofre por causa das orelhas abertas e a família nem sempre sabe qual é o próximo passo.',script:'O primeiro passo é conversar, avaliar e entender os critérios com responsabilidade. Cada caso precisa ser analisado com o responsável, com autorização e com orientação adequada. A família pode se organizar com calma para um período mais tranquilo.',visual:'Dra. Alexia falando; ambiente e equipe. Não expor crianças sem autorização.',cta:'Se você quer entender melhor, fale com a nossa equipe.'},
      {date:'27/09',week:'domingo',theme:'Bastidores',title:'O cuidado antes do procedimento',format:'Bastidor · Stories ou Reels',duration:'15–25s',focus:'Mostrar a experiência da clínica.',hook:'O cuidado começa antes do procedimento: começa na escuta e na avaliação.',script:'Sem precisar de uma fala longa, mostrar os pequenos gestos que fazem parte do atendimento: preparar a sala, organizar materiais, receber a paciente e conversar com atenção.',visual:'Recepção, mãos, consultório, equipe e detalhes de preparação.',cta:'Cuidado também é prestar atenção em cada etapa.'},
      {date:'28/09',week:'segunda',theme:'Otomodelação',title:'Ainda dá tempo de avaliar',format:'Reels curto',duration:'20–30s',focus:'Falar com quem está adiando.',hook:'Ainda dá tempo de passar por uma avaliação antes de outubro.',script:'Se você está adiando porque não sabe por onde começar, comece por uma conversa. A avaliação organiza as dúvidas, mostra o que faz sentido e ajuda você a decidir sem pressa.',visual:'Duas versões: uma direta e outra mais acolhedora.',cta:'Fale com a equipe e veja os horários.'},
      {date:'29/09',week:'terça',theme:'Mentoria',title:'Bastidores da formação',format:'Reels · convite',duration:'30–40s',focus:'Mostrar a experiência da mentoria.',hook:'Aprender um novo procedimento também é aprender a conduzir uma experiência.',script:'Na mentoria, o profissional entende método, indicação, prática, atendimento e posicionamento. O objetivo é sair com mais clareza para oferecer a otomodelação com responsabilidade.',visual:'Aula, materiais, orientação e frase curta de uma aluna autorizada.',cta:'Envie uma mensagem para saber como participar.'},
      {date:'30/09',week:'quarta',theme:'Famílias',title:'Outubro começa com planejamento',format:'Vídeo de encerramento',duration:'30–40s',focus:'Fechar o mês e apresentar o próximo passo.',hook:'Outubro pode ser um mês especial para famílias que querem planejar a avaliação com calma.',script:'Se a sua família convive com uma insegurança relacionada às orelhas, este pode ser o momento de buscar informação e organizar uma conversa. Cada caso precisa de avaliação, critério e cuidado.',visual:'Plano fixo, ambiente claro e pausas entre cada frase.',cta:'Fale com a equipe para entender o próximo passo.'}
    ];
    const angleData = {
      'Otomodelação': {
        hooks:['Você já imaginou como seria deixar de pensar nas suas orelhas em toda foto ou quando prende o cabelo?','Muita gente passa anos convivendo com um incômodo porque não sabe como começar a investigar as possibilidades.'],
        bodies:['A conversa começa entendendo a sua história, o que incomoda e o que você espera. Depois, a avaliação ajuda a explicar o que pode ou não fazer sentido para o seu caso. Não existe uma resposta igual para todo mundo, e por isso a orientação individual é tão importante.','O objetivo não é criar uma aparência artificial ou mudar quem você é. É entender proporções, possibilidades e limites com cuidado. Quando a pessoa tem informação, consegue tomar uma decisão mais tranquila, sem pressão e sem promessa pronta.']
      },
      'Prova social': {
        hooks:['Toda paciente chega com um motivo diferente para procurar ajuda.','Uma história real não começa no resultado. Começa no momento em que a pessoa decide conversar sobre algo que a incomoda.'],
        bodies:['Algumas pessoas falam sobre fotos, cabelo preso ou uma insegurança antiga. Outras só querem entender se existe uma alternativa para o que sentem. O papel da clínica é escutar, avaliar e explicar o caminho com honestidade.','Para contar uma história com responsabilidade, não precisamos exagerar nem prometer a mesma experiência para todo mundo. O mais importante é mostrar a transformação de confiança e o cuidado presente em cada etapa do processo.']
      },
      'Avaliação facial': {
        hooks:['Antes de escolher um tratamento para o rosto, existe uma etapa que muita gente pula.','Se algo no contorno do rosto começou a incomodar, não é preciso escolher um procedimento no impulso.'],
        bodies:['Pele, volume, flacidez, gordura localizada e expectativa podem participar dessa avaliação. Olhar para tudo junto ajuda a construir uma orientação mais coerente e evita tratar apenas um detalhe sem entender o conjunto.','Cada rosto tem uma necessidade e uma história. Por isso, uma avaliação presencial permite conversar, observar com calma e explicar quais caminhos podem ser considerados, sempre sem diagnóstico pelo vídeo e sem promessa milagrosa.']
      },
      'Mentoria': {
        hooks:['Profissional da estética: você quer ampliar seu repertório com mais segurança e método?','Aprender um procedimento é apenas uma parte do trabalho de quem atende na estética.'],
        bodies:['Na mentoria, o profissional precisa entender indicação, condução, experiência do paciente, prática e posicionamento. O objetivo é sair da aula com mais clareza sobre o processo inteiro, e não apenas com uma técnica isolada.','Uma formação responsável também fala sobre limites, seleção de casos e atendimento. É isso que ajuda o profissional a oferecer um novo serviço com mais consciência, organização e segurança para quem será atendido.']
      },
      'Famílias': {
        hooks:['Quando uma criança ou adolescente se incomoda com as orelhas, a família também precisa de acolhimento e informação.','Nem sempre a família sabe qual é o primeiro passo quando percebe que as orelhas estão afetando a confiança da criança.'],
        bodies:['A conversa precisa envolver o responsável, considerar a idade, ouvir a criança ou adolescente e entender os critérios de avaliação. Não é uma decisão para ser tomada por pressão ou por comparação com outra pessoa.','O melhor caminho é organizar as dúvidas, entender as possibilidades e planejar com calma. Cada caso precisa ser avaliado individualmente, com autorização e orientação adequada para a família.']
      },
      'Bastidores': {
        hooks:['O cuidado de uma clínica aparece também nos detalhes que acontecem antes do procedimento.','Antes de qualquer atendimento, existe uma sequência de cuidados que ajuda a pessoa a se sentir segura.'],
        bodies:['Preparar o ambiente, conferir os materiais, receber com atenção e explicar cada etapa fazem parte da experiência. São ações simples, mas mostram que o atendimento não começa apenas quando a câmera ou o procedimento começa.','Bastidores bons não precisam expor pacientes nem inventar cenas. Eles podem mostrar a equipe, as mãos, o ambiente e a organização que sustentam um atendimento mais cuidadoso e humano.']
      }
    };
    function buildOptions(video){
      const guide = angleData[video.theme] || angleData['Otomodelação'];
      return [
        {title:'Opção 1 · Direta', hook:video.hook, script:`${video.script} ${guide.bodies[0]} O próximo passo é conversar com calma e entender se essa avaliação faz sentido para você.`, cta:video.cta, visual:video.visual},
        {title:'Opção 2 · Pergunta real', hook:guide.hooks[0], script:`${guide.hooks[0]} ${video.script} ${guide.bodies[1]} A avaliação existe para transformar uma dúvida em informação e ajudar você a decidir com mais segurança.`, cta:video.cta, visual:`Abrir com a pergunta olhando para a lente; depois, alternar plano médio e cenas de apoio. ${video.visual}`},
        {title:'Opção 3 · História e contexto', hook:guide.hooks[1], script:`${guide.hooks[1]} ${guide.bodies[0]} ${video.script} ${guide.bodies[1]} No final, reforçar que cada pessoa precisa ser orientada de forma individual e respeitosa.`, cta:video.cta, visual:`Começar com uma cena de contexto e entrar na fala da Dra. Alexia. ${video.visual}`}
      ];
    }
    videos.forEach(v=>{ v.options=buildOptions(v); v.duration='45–60s'; });
    const filters = ['Todos', ...new Set(videos.map(v => v.theme))];
    let active = 'Todos'; let selected = 0; let selectedOption = 0;
    const calendar = document.querySelector('#calendar');
    const detail = document.querySelector('#detail');
    const filterBox = document.querySelector('#filters');
    function renderFilters(){ filterBox.innerHTML = filters.map(f => `<button class="filter ${f===active?'active':''}" data-filter="${f}">${f}</button>`).join(''); filterBox.querySelectorAll('button').forEach(b => b.onclick=()=>{active=b.dataset.filter; render();}); }
    function renderCalendar(){ const firstDay = 1; const cells = []; for(let i=0;i<firstDay;i++) cells.push('<span></span>'); for(let day=1;day<=30;day++){ const index=videos.findIndex(v=>Number(v.date.slice(0,2))===day && (active==='Todos'||v.theme===active)); const enabled=index>=0; cells.push(`<button class="calendar-day ${enabled?'available':''} ${index===selected?'selected':''}" ${enabled?`data-index="${index}"`:'disabled'}>${day}</button>`); } calendar.innerHTML=cells.join(''); calendar.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.index); selectedOption=0; renderCalendar(); renderDetail();}); }
    function renderOption(video){ const option=video.options[selectedOption]; const readableScript=option.script.replace(/\.\s+/g,'.\n\n'); const area=document.querySelector('#option-area'); area.innerHTML=`<div class="option-switcher">${video.options.map((o,i)=>`<button class="option-button ${i===selectedOption?'active':''}" data-option="${i}">${o.title}</button>`).join('')}</div><div class="script-grid"><section class="section"><h3>1. Gancho</h3><p>${option.hook}</p></section><section class="section"><h3>2. Fala sugerida</h3><p class="script">${readableScript}</p></section><section class="section"><h3>3. Fechamento</h3><p>${option.cta}</p></section><section class="section"><h3>4. Como gravar</h3><p>${option.visual}</p></section></div>`; area.querySelectorAll('.option-button').forEach(b=>b.onclick=()=>{selectedOption=Number(b.dataset.option); renderOption(video);}); }
    function renderDetail(){ const v=videos[selected]; detail.classList.remove('swap'); detail.innerHTML=`<div class="detail-kicker">${v.date} · ${v.week} · ${v.theme}</div><h2>${v.title}</h2><p class="detail-intro">${v.focus}</p><div class="meta"><span>Formato <b>${v.format}</b></span><span>Duração <b>${v.duration}</b></span></div><div id="option-area"></div>`; renderOption(v); requestAnimationFrame(()=>detail.classList.add('swap')); }
    function render(){renderFilters();renderCalendar();renderDetail();}
    render();
  </script>
</body>
</html>
