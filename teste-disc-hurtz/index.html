<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Diagnóstico DISC interno da Hurtz Company.">
  <title>Diagnóstico DISC interno · Hurtz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--brasa:#C06018;--brasa-dark:#974A12;--brasa-soft:#F9EDE3;--carvao:#181614;--grafite:#3D3A36;--pedra:#8C8880;--areia:#E8E4DC;--offwhite:#F5F2EC;--green:#1A7A4A;--font:Inter,Arial,sans-serif;--max:760px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--offwhite);color:var(--carvao);font-family:var(--font);font-size:15px;line-height:1.6}button,input{font:inherit}button{cursor:pointer}body{display:flex;justify-content:center}.app{width:100%;max-width:var(--max);padding:24px 20px 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:56px}.logo{width:118px;height:auto;display:block}.eyebrow{margin:0 0 18px;color:var(--brasa);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.brand-rule{height:2px;width:48px;background:var(--brasa);margin:0 0 24px}.hero h1{margin:0;max-width:680px;font-size:clamp(32px,7vw,58px);line-height:1.02;letter-spacing:-.045em}.hero p{max-width:600px;margin:24px 0 0;color:var(--grafite);font-size:17px}.card{margin-top:34px;background:#fff;border:1px solid var(--areia);border-radius:4px;padding:32px}.card.dark{background:var(--carvao);color:var(--offwhite);border-color:var(--carvao)}.intro-meta{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 0}.tag{display:inline-flex;padding:6px 10px;border:1px solid var(--areia);border-radius:999px;color:var(--grafite);font-size:12px}.dark .tag{border-color:#4a4641;color:var(--offwhite)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.field{display:grid;gap:8px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;letter-spacing:.04em}.field input{width:100%;border:1px solid var(--areia);border-radius:2px;padding:14px 15px;background:#fff;color:var(--carvao);outline:none}.field input:focus{border-color:var(--carvao)}.consent{display:flex;align-items:flex-start;gap:10px;margin-top:20px;color:var(--grafite);font-size:12px;line-height:1.45}.consent input{margin-top:4px;accent-color:var(--brasa)}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px}.btn{border:0;border-radius:2px;padding:14px 20px;font-weight:700;transition:background-color 120ms ease,color 120ms ease}.btn-primary{background:var(--brasa);color:#fff}.btn-primary:hover{background:var(--brasa-dark)}.btn-secondary{background:transparent;color:var(--carvao);border:1.5px solid var(--carvao)}.btn-secondary:hover{background:var(--carvao);color:var(--offwhite)}.btn:disabled{opacity:.45;cursor:not-allowed}.progress-wrap{margin-bottom:26px}.progress-line{height:4px;background:var(--areia);overflow:hidden}.progress-line span{display:block;height:100%;background:var(--brasa);transition:width 180ms ease}.progress-label{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:var(--pedra);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.question-card{margin-top:0}.question-card h2{margin:0;max-width:620px;font-size:clamp(25px,5vw,38px);line-height:1.1;letter-spacing:-.03em}.question-card .hint{margin:12px 0 0;color:var(--grafite)}.options{display:grid;gap:10px;margin-top:30px}.option{position:relative;display:flex;align-items:flex-start;gap:14px;width:100%;padding:17px 18px;border:1px solid var(--areia);border-radius:2px;background:#fff;color:var(--carvao);text-align:left;line-height:1.4}.option:hover{border-color:var(--brasa)}.option.selected{border-color:var(--brasa);background:var(--brasa-soft)}.option-mark{display:grid;place-items:center;flex:0 0 24px;width:24px;height:24px;border:1px solid var(--pedra);border-radius:50%;font-size:11px;font-weight:700;color:var(--pedra)}.option.selected .option-mark{background:var(--brasa);border-color:var(--brasa);color:#fff}.helper{color:var(--pedra);font-size:12px}.loading{text-align:center;padding:50px 10px}.loader{width:42px;height:42px;margin:0 auto 22px;border:3px solid var(--areia);border-top-color:var(--brasa);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.result-head h2{margin:0;font-size:clamp(28px,5vw,44px);line-height:1.04;letter-spacing:-.04em}.profile-code{color:var(--brasa);font-size:54px;font-weight:700;line-height:1}.result-copy{margin:18px 0 0;color:var(--grafite)}.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:28px}.score{border:1px solid var(--areia);padding:13px 10px}.score strong{display:block;font-size:25px;line-height:1}.score small{display:block;margin-top:4px;color:var(--pedra);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.report-section{margin-top:30px;border-top:1px solid var(--areia);padding-top:24px}.report-section h3{margin:0 0 10px;font-size:16px}.report-section p{margin:0;color:var(--grafite)}.report-section ul{margin:0;padding-left:18px;color:var(--grafite)}.report-section li+li{margin-top:7px}.disclaimer{margin-top:28px;padding:14px;background:var(--brasa-soft);color:var(--brasa-dark);font-size:12px}.error{margin-top:14px;color:#B52A2A;font-size:13px;font-weight:700}.muted{color:var(--pedra);font-size:12px}.footer-note{margin-top:38px;color:var(--pedra);font-size:11px}.hidden{display:none!important}@media(max-width:620px){.app{padding:18px 14px 36px}.topbar{margin-bottom:38px}.card{padding:23px 18px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions{align-items:stretch;flex-direction:column-reverse}.actions .btn{width:100%}.result-head{flex-direction:column-reverse;gap:16px}.profile-code{font-size:42px}.score-grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:39px}.hero p{font-size:15px}}
    @media print{body{background:#fff}.app{max-width:none;padding:0}.topbar,.progress-wrap,.actions,.footer-note{display:none!important}.card{border:0;padding:0}.report-section{break-inside:avoid}.disclaimer{border:1px solid var(--areia)}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><img class="logo" src="logo-atual-claro.png" alt="Hurtz Company"><span class="muted">Uso interno</span></header>
    <section id="app" aria-live="polite"></section>
    <p class="footer-note">Diagnóstico DISC interno para autoconhecimento e desenvolvimento. Não é teste oficial, clínico ou decisão automática de RH.</p>
  </main>
  <script>
    const API_URL = "https://uxttihjsxfowursjyult.supabase.co/functions/v1/disc-submit";
    const VERSION = "disc-interno-v1";
    const STORAGE_KEY = "hurtz-disc-interno-v1";
    const questions = [
      ["Quando surge um desafio novo, qual atitude mais combina com você?",["Assumo a frente e decido rápido.","Puxo conversa e mobilizo as pessoas.","Escuto o grupo e mantenho um ritmo estável.","Analiso os detalhes antes de decidir."]],
      ["Em uma mudança de processo, você costuma...",["Prefiro entender o cenário antes de mudar algo.","Confiro critérios e informações.","Parto para a ação e resolvo o que trava.","Animo o ambiente e envolvo o time."]],
      ["Quando precisa defender uma ideia, você tende a...",["Gostar de trocar ideias e criar conexão.","Definir uma direção e seguir em frente.","Procurar consistência e segurança.","Comparar dados e buscar precisão."]],
      ["Em uma decisão coletiva, você normalmente...",["Reviso o trabalho para garantir qualidade.","Dou espaço para ouvir e construir junto.","Explico a ideia e ganho adesão.","Tomo uma decisão quando o caminho está claro."]],
      ["Sob pressão, você tende a...",["Encarar desafios e buscar metas maiores.","Seguir critérios para reduzir erros.","Valorizar previsibilidade e parceria.","Levar energia para começar e engajar."]],
      ["Em uma equipe, você costuma...",["Manter a equipe conectada e motivada.","Organizar informações e padrões.","Acelerar quando existe uma oportunidade.","Cuidar da continuidade e do clima do grupo."]],
      ["Ao conhecer alguém novo no trabalho, você tende a...",["Fazer contato com facilidade e abrir portas.","Estruturar a ideia antes de apresentar.","Assumir a responsabilidade pelo próximo passo.","Considerar o impacto da decisão no time."]],
      ["Quando recebe uma tarefa complexa, você prefere...",["Trabalhar com metas objetivas.","Questionar premissas e procurar evidências.","Combinar expectativas antes de executar.","Fazer pontes e manter as pessoas envolvidas."]],
      ["Quando o time perde ritmo, você tende a...",["Dar atenção ao que o time precisa para avançar.","Escolher uma direção e cobrar movimento.","Comunicar a ideia com entusiasmo.","Organizar o processo e verificar os detalhes."]],
      ["Em uma conversa difícil, você costuma...",["Buscar uma conversa leve e produtiva.","Ver o que pode ser decidido agora.","Validar cada etapa.","Tentar preservar estabilidade durante mudanças."]],
      ["Antes de entregar algo importante, você tende a...",["Conferir o padrão antes de entregar.","Manter o acordo e a rotina funcionando.","Puxar o assunto difícil para resolver.","Encontrar um jeito de envolver quem está ao redor."]],
      ["Quando precisa resolver um problema, você normalmente...",["Fazer perguntas e manter a conversa aberta.","Ir direto ao ponto principal.","Procurar uma solução sustentável.","Mapear as variáveis antes de recomendar algo."]],
      ["Ao entrar em um projeto novo, você costuma...",["Dar tempo para as pessoas se adaptarem.","Organizar referências para reduzir dúvidas.","Criar conexão e facilitar a troca.","Transformar intenção em uma decisão."]],
      ["Quando alguém do time está com dificuldade, você tende a...",["Construir passo a passo com a pessoa.","Proteger a qualidade mesmo com pressão.","Fazer o plano sair do papel.","Aproximar a pessoa da ação."]],
      ["Quando tudo parece prioridade, você normalmente...",["Apresentar possibilidades e estimular movimento.","Procurar uma rota segura e repetível.","Acompanhar o que foi combinado.","Definir prioridade e cortar excessos."]],
      ["Em uma reunião longa, você tende a...",["Deixar os critérios explícitos.","Fazer a conversa acontecer com naturalidade.","Tomar a liderança quando falta direção.","Buscar consenso e continuidade."]],
      ["Quando um projeto trava, você costuma...",["Cuidar do ritmo para ninguém ficar para trás.","Destravar logo o que depende de decisão.","Reunir evidências antes de concluir.","Animar o grupo para seguir em frente."]],
      ["Em tarefas repetidas, você tende a...",["Manter o padrão mesmo em tarefas repetidas.","Gostar de metas que desafiam sua capacidade.","Valorizar um ambiente de confiança.","Levar energia e presença para as conversas."]],
      ["Quando uma meta muda, você normalmente...",["Fazer a equipe se sentir parte da solução.","Dar um corte claro quando é hora de escolher.","Manter a execução organizada.","Pensar no impacto antes de alterar a rota."]],
      ["Ao começar uma semana de trabalho, você prefere...",["Colocar o plano em movimento.","Evitar mudanças sem fundamento.","Trazer leveza e entusiasmo para o trabalho.","Manter acordos e relações estáveis."]],
      ["Quando precisa alinhar várias pessoas, você tende a...",["Conectar pessoas e ideias rapidamente.","Criar um ambiente previsível para executar.","Revisar o que pode gerar retrabalho.","Definir o resultado que precisa ser alcançado."]],
      ["Ao testar uma nova abordagem, você normalmente...",["Ter facilidade para testar e ajustar.","Ajustar com base em fatos.","Considerar o ritmo e a segurança do grupo.","Comunicar o próximo passo com clareza."]],
      ["Quando há muita pressão, você tende a...",["Procurar entender antes de responder.","Buscar precisão e lógica na decisão.","Assumir o comando.","Mobilizar o time com uma visão positiva."]],
      ["Ao encerrar uma entrega, você costuma...",["Verificar se todos entenderam o combinado.","Dar energia para o grupo sair da inércia.","Avaliar riscos e detalhes importantes.","Preservar a cooperação durante a mudança."]]
    ].map(([title, options], index) => ({ id: `q${String(index + 1).padStart(2, "0")}`, title, options }));

    let state = loadState();
    const app = document.getElementById("app");

    function loadState(){
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { step:"intro", answers:{}, lead:{} }; }
      catch { return { step:"intro", answers:{}, lead:{} }; }
    }
    function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function esc(value){ return String(value ?? "").replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char])); }
    function list(items){ return `<ul>${(items || []).map(item => `<li>${esc(item)}</li>`).join("")}</ul>`; }
    function render(){
      if(state.step === "loading") return renderLoading();
      if(state.step === "result" && state.result) return renderResult();
      if(state.step === "intro") return renderIntro();
      return renderQuestion();
    }
    function renderIntro(){
      app.innerHTML = `<section class="hero"><p class="eyebrow">Diagnóstico interno · 24 perguntas</p><div class="brand-rule"></div><h1>Entenda como você opera melhor.</h1><p>Um mapa rápido do seu estilo de trabalho para melhorar comunicação, rotina e colaboração dentro da Hurtz.</p></section><section class="card"><div class="intro-meta"><span class="tag">10 minutos</span><span class="tag">Sem resposta certa</span><span class="tag">Resultado individual</span></div><form id="lead-form" novalidate><div class="form-grid"><div class="field full"><label for="nome">Seu nome</label><input id="nome" name="nome" type="text" autocomplete="name" placeholder="Como você gosta de ser chamado?" value="${esc(state.lead.nome || "")}" required></div><div class="field full"><label for="email">Seu e-mail</label><input id="email" name="email" type="email" autocomplete="email" placeholder="voce@empresa.com" value="${esc(state.lead.email || "")}" required></div></div><label class="consent"><input id="consent" type="checkbox" ${state.lead.consent ? "checked" : ""} required><span>Autorizo a Hurtz a registrar minhas respostas e usar este diagnóstico exclusivamente para desenvolvimento interno da equipe.</span></label><p id="intro-error" class="error" role="alert"></p><div class="actions"><span class="helper">Responda pensando no seu comportamento mais frequente.</span><button class="btn btn-primary" type="submit">Começar diagnóstico →</button></div></form></section>`;
      document.getElementById("lead-form").addEventListener("submit", event => { event.preventDefault(); startQuiz(); });
    }
    function startQuiz(){
      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const consent = document.getElementById("consent").checked;
      const error = document.getElementById("intro-error");
      if(nome.length < 2){ error.textContent = "Informe seu nome."; return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ error.textContent = "Informe um e-mail válido."; return; }
      if(!consent){ error.textContent = "Aceite o uso interno dos dados para continuar."; return; }
      state.lead = { nome, email, consent:true }; state.step = 0; saveState(); render();
    }
    function renderQuestion(){
      const question = questions[state.step];
      const selected = state.answers[question.id] || "";
      const progress = Math.round(((state.step + 1) / questions.length) * 100);
      app.innerHTML = `<div class="progress-wrap"><div class="progress-line"><span style="width:${progress}%"></span></div><div class="progress-label"><span>Pergunta ${state.step + 1} de ${questions.length}</span><span>${progress}%</span></div></div><section class="card question-card"><p class="eyebrow">Escolha uma alternativa</p><h2>${esc(question.title)}</h2><p class="hint">Não pense demais. Marque a frase que mais parece com você no trabalho.</p><div class="options" role="radiogroup" aria-label="Alternativas da pergunta">${question.options.map((option, index) => `<button class="option ${selected === "abcd"[index] ? "selected" : ""}" type="button" data-option="${"abcd"[index]}" role="radio" aria-checked="${selected === "abcd"[index]}"><span class="option-mark">${"abcd"[index].toUpperCase()}</span><span>${esc(option)}</span></button>`).join("")}</div><p id="question-error" class="error" role="alert"></p><div class="actions"><button class="btn btn-secondary" type="button" id="back" ${state.step === 0 ? "disabled" : ""}>← Voltar</button><button class="btn btn-primary" type="button" id="next">${state.step === questions.length - 1 ? "Ver meu resultado →" : "Continuar →"}</button></div></section>`;
      document.querySelectorAll("[data-option]").forEach(button => button.addEventListener("click", () => { state.answers[question.id] = button.dataset.option; saveState(); renderQuestion(); }));
      document.getElementById("back").addEventListener("click", () => { if(state.step > 0){ state.step -= 1; saveState(); render(); } });
      document.getElementById("next").addEventListener("click", () => { if(!state.answers[question.id]){ document.getElementById("question-error").textContent = "Escolha uma alternativa para continuar."; return; } if(state.step === questions.length - 1) submitQuiz(); else { state.step += 1; saveState(); render(); } });
    }
    function renderLoading(){ app.innerHTML = `<section class="card loading"><div class="loader" aria-hidden="true"></div><p class="eyebrow">Processando seu resultado</p><h2>Organizando seu mapa de trabalho.</h2><p class="result-copy">Cruzando suas respostas e preparando recomendações práticas para sua rotina na Hurtz.</p></section>`; }
    async function submitQuiz(){
      state.step = "loading"; saveState(); render();
      try{
        const response = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({version:VERSION,nome:state.lead.nome,email:state.lead.email,consentimento_lgpd:true,answers:state.answers,source_url:window.location.href})});
        const data = await response.json().catch(() => ({}));
        if(!response.ok || !data.success) throw new Error(data.error || "Não foi possível gerar o resultado.");
        state.result = data.result; state.submissionId = data.submission_id; state.step = "result"; saveState(); render();
      }catch(error){ state.step = questions.length - 1; saveState(); render(); const message = document.getElementById("question-error"); if(message) message.textContent = error.message; }
    }
    function renderResult(){
      const result = state.result; const report = result.report || {}; const scores = result.scores || {};
      app.innerHTML = `<section class="hero"><p class="eyebrow">Seu resultado está pronto</p><div class="brand-rule"></div><div class="result-head"><div><h1>${esc(result.profile_label)}</h1><p class="result-copy">${esc(report.summary || "Seu resultado foi registrado.")}</p></div><div class="profile-code" aria-label="Perfil ${esc(result.profile_code)}">${esc(result.profile_code)}</div></div></section><section class="card" id="report"><p class="eyebrow">${esc(state.lead.nome)} · leitura interna</p><div class="score-grid">${[["D","Dominância"],["I","Influência"],["S","Estabilidade"],["C","Conformidade"]].map(([code,label]) => `<div class="score"><strong>${Number(scores[code] || 0)}</strong><small>${label}</small></div>`).join("")}</div><div class="report-section"><h3>Suas forças naturais</h3>${list(report.strengths)}</div><div class="report-section"><h3>Pontos de atenção</h3>${list(report.attention_points)}</div><div class="report-section"><h3>Como se comunicar com você</h3><p>${esc(report.communication || "")}</p></div><div class="report-section"><h3>Como isso aparece na Hurtz</h3><p>${esc(report.hurtz_impact || "")}</p></div><div class="report-section"><h3>Três práticas para levar para a rotina</h3>${list(report.recommendations)}</div><div class="disclaimer">${esc(report.disclaimer || "Este resultado é uma ferramenta interna de autoconhecimento, não um diagnóstico oficial ou clínico.")}</div><p class="muted" style="margin-top:14px">Registro: ${esc(String(state.submissionId || "").slice(0,8).toUpperCase())}</p></section><div class="actions"><button class="btn btn-secondary" id="download">Baixar resumo .txt</button><button class="btn btn-primary" id="print">Baixar relatório em PDF →</button></div><div class="actions"><button class="btn btn-secondary" id="restart">Refazer diagnóstico</button></div>`;
      document.getElementById("download").addEventListener("click", downloadText); document.getElementById("print").addEventListener("click", () => window.print()); document.getElementById("restart").addEventListener("click", () => { localStorage.removeItem(STORAGE_KEY); state = {step:"intro",answers:{},lead:{}}; render(); });
    }
    function reportText(){ const r=state.result||{}; const p=r.report||{}; return [`DIAGNÓSTICO DISC INTERNO · HURTZ`,`Nome: ${state.lead.nome}`,`Perfil: ${r.profile_label} (${r.profile_code})`,``,p.summary||"","FORÇAS",...(p.strengths||[]).map(x=>`- ${x}`),``,`PONTOS DE ATENÇÃO`,...(p.attention_points||[]).map(x=>`- ${x}`),``,`COMUNICAÇÃO`,p.communication||"","","IMPACTO NA HURTZ",p.hurtz_impact||"","","PRÁTICAS",...(p.recommendations||[]).map(x=>`- ${x}`),``,p.disclaimer||""].join("\n"); }
    function downloadText(){ const blob=new Blob([reportText()],{type:"text/plain;charset=utf-8"}); const url=URL.createObjectURL(blob); const link=document.createElement("a"); link.href=url; link.download=`diagnostico-disc-${(state.lead.nome||"resultado").toLowerCase().replace(/[^a-z0-9]+/g,"-")}.txt`; link.click(); URL.revokeObjectURL(url); }
    render();
  </script>
</body>
</html>
